<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NetShare — Compartilhamento simples e seguro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');

  :root {
    --bg: #070b18;
    --bg-soft: #0b1124;
    --card: rgba(17, 25, 49, .78);
    --card-solid: #111931;
    --surface: rgba(255, 255, 255, .055);
    --surface-hover: rgba(255, 255, 255, .09);
    --fg: #f7f9ff;
    --mut: #9da8c2;
    --line: rgba(255, 255, 255, .105);
    --acc: #6c7cff;
    --acc-2: #8f6cff;
    --cyan: #49d9ff;
    --ok: #43d9a3;
    --bad: #ff667d;
    --warning: #ffd166;
    --shadow: 0 30px 80px rgba(0, 0, 0, .42);
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  html {
    background:
      radial-gradient(circle at 18% 12%, rgba(108, 124, 255, .18) 0, rgba(108, 124, 255, .08) 22rem, transparent 42rem),
      radial-gradient(circle at 88% 84%, rgba(73, 217, 255, .12) 0, rgba(73, 217, 255, .05) 20rem, transparent 40rem),
      var(--bg);
    background-attachment: fixed;
    background-repeat: no-repeat;
  }
  body {
    margin: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: transparent;
    color: var(--fg);
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: .18;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 56px 56px;
  }

  button, input, select { font: inherit; }
  button, a, input, select { -webkit-tap-highlight-color: transparent; }
  button {
    min-height: 44px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 10px 16px;
    background: linear-gradient(135deg, var(--acc), var(--acc-2));
    color: #fff;
    font-weight: 700;
    letter-spacing: -.01em;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(108,124,255,.22), inset 0 1px rgba(255,255,255,.18);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease, opacity .2s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(108,124,255,.3), inset 0 1px rgba(255,255,255,.2); }
  button:active:not(:disabled) { transform: translateY(0) scale(.98); }
  button.sec { background: var(--surface); box-shadow: none; color: #dce3f7; }
  button.sec:hover:not(:disabled) { background: var(--surface-hover); border-color: rgba(255,255,255,.2); box-shadow: none; }
  button.bad { background: rgba(255,102,125,.12); border-color: rgba(255,102,125,.25); color: #ff9bad; box-shadow: none; }
  button:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
  input, select {
    width: 100%;
    min-height: 48px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 13px;
    outline: none;
    background: rgba(5, 9, 22, .65);
    color: var(--fg);
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  input::placeholder { color: #66718c; }
  input:hover, select:hover { border-color: rgba(255,255,255,.2); }
  input:focus, select:focus { border-color: var(--acc); background: rgba(8,13,30,.9); box-shadow: 0 0 0 4px rgba(108,124,255,.13); }
  select { cursor: pointer; }
  option { background: #111931; color: var(--fg); }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .hidden { display: none !important; }
  .mut { color: var(--mut); font-size: .84rem; line-height: 1.55; }

  .ambient { display: none; }

  .brand { display: flex; align-items: center; gap: 11px; font: 800 1.14rem/1 'Manrope', sans-serif; letter-spacing: -.04em; }
  .brand-mark { position: relative; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(135deg, var(--acc), var(--cyan)); box-shadow: 0 9px 24px rgba(79,132,255,.34); }
  .brand-mark svg { width: 19px; height: 19px; }
  .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(67,217,163,.12); }
  .eyebrow { display: flex; align-items: center; gap: 8px; color: #b6c0db; font-size: .76rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }

  #gh, #lang { position: fixed; top: 22px; z-index: 20; border: 1px solid var(--line); background: rgba(12,18,37,.7); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  #gh { right: 24px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; color: #dfe5f6; transition: transform .2s, background .2s, color .2s; }
  #gh:hover { background: #fff; color: #0b1020; transform: translateY(-2px); }
  #lang {
    right: 78px;
    width: 205px;
    max-width: calc(100vw - 102px);
    min-height: 44px;
    padding: 0 36px 0 13px;
    border-radius: 13px;
    font-size: .88rem;
    text-overflow: ellipsis;
  }

  #join {
    position: relative;
    width: min(92vw, 480px);
    margin: 36px auto 0;
    padding: clamp(25px, 5vw, 38px);
    display: grid;
    gap: 16px;
    border: 1px solid var(--line);
    border-radius: 26px;
    background: linear-gradient(145deg, rgba(21,31,60,.88), rgba(10,16,35,.82));
    box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,.08);
    backdrop-filter: blur(22px);
    animation: enter .65s cubic-bezier(.2,.8,.2,1) both;
  }
  #join::before { content: ''; position: absolute; inset: -1px; padding: 1px; border-radius: inherit; background: linear-gradient(135deg, rgba(132,145,255,.42), transparent 42%, rgba(73,217,255,.2)); pointer-events: none; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  #join .brand { margin-bottom: 10px; }
  #join h1 { margin: 4px 0 0; max-width: 390px; font: 800 clamp(1.75rem, 6vw, 2.5rem)/1.08 'Manrope', sans-serif; letter-spacing: -.055em; }
  #join > p { margin: 0; }
  #join label { display: grid; gap: 7px; color: #c8d0e5; font-size: .84rem; font-weight: 600; }
  #join label:first-of-type { margin-top: 6px; }
  #btnJoin { width: 100%; margin-top: 4px; min-height: 52px; }
  #joinErr { margin: 0; min-height: 0; color: #ff9bad; font-size: .85rem; font-weight: 700; }
  #joinErr:empty { display: none; }
  .privacy-note { display: flex; gap: 9px; align-items: flex-start; padding: 11px 12px; border-radius: 12px; background: rgba(67,217,163,.055); border: 1px solid rgba(67,217,163,.1); }
  .privacy-note svg { flex: 0 0 auto; margin-top: 2px; color: var(--ok); }

  #room { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; display: grid; grid-template-columns: minmax(0,1fr) 280px; grid-template-rows: auto minmax(0,1fr) auto; gap: 12px; padding: 16px; background: transparent; }
  #room header { grid-column: 1/-1; min-height: 58px; display: flex; justify-content: flex-start; align-items: center; gap: 12px; padding: 7px 220px 7px 8px; flex-wrap: wrap; }
  #room header .brand { margin-right: 10px; }
  #room header h2 { margin: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); font-size: .9rem; font-weight: 600; }
  #msg { color: var(--warning); font-size: .84rem; }
  #status { opacity: .82; }
  #btnLink { min-height: 38px; padding: 7px 12px; }
  #grid { display: grid; gap: 10px; min-height: 0; min-width: 0; overflow: hidden; grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr); }
  .tile { position: relative; min-height: 0; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #02040a; box-shadow: 0 18px 45px rgba(0,0,0,.28); animation: enter .35s ease both; }
  .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #02040a; }
  .note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mut); font-size: .9rem; text-align: center; padding: 12px; white-space: pre-line; }
  .tbtn { position: absolute; min-height: 34px; padding: 5px 10px; font-size: .76rem; border-radius: 9px; background: rgba(7,11,24,.78); box-shadow: none; backdrop-filter: blur(10px); }
  .tbtn.snd { right: 10px; bottom: 10px; }
  .tbtn.hide { right: 10px; top: 10px; }
  .tvol { position: absolute; left: 10px; top: 15px; width: 95px; min-height: 0; padding: 0; border: 0; background: transparent; opacity: .85; }
  .label { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 160px); padding: 6px 10px; border: 1px solid rgba(255,255,255,.1); border-radius: 9px; background: rgba(7,11,24,.78); color: #fff; font-size: .78rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; backdrop-filter: blur(10px); }
  .tile .tbtn, .tile .tvol, .tile .label { transition: opacity .18s; }
  .tile:not(.ui) .tbtn, .tile:not(.ui) .tvol, .tile:not(.ui) .label { opacity: 0; pointer-events: none; }
  #empty { position: relative; display: grid; place-items: center; text-align: center; padding: 60px 20px 20px; border: 1px dashed rgba(139,151,186,.28); border-radius: 18px; color: var(--mut); background: radial-gradient(circle at center, rgba(108,124,255,.07), transparent 48%), rgba(255,255,255,.018); }
  #empty::before { content: ''; position: absolute; width: 64px; height: 64px; top: calc(50% - 70px); border: 1px solid rgba(108,124,255,.22); border-radius: 20px; background: rgba(108,124,255,.08); }

  aside { min-height: 0; overflow: auto; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: 0 18px 45px rgba(0,0,0,.18); backdrop-filter: blur(16px); }
  aside h3 { margin: 2px 0 14px; font: 700 .92rem 'Manrope', sans-serif; }
  #people { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #people li { padding: 10px 11px; border: 1px solid rgba(255,255,255,.06); border-radius: 11px; background: rgba(4,8,20,.38); font-size: .86rem; }
  .prow { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .prow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
  .acts button { min-height: 29px; padding: 4px 8px; border-radius: 7px; font-size: .7rem; }
  .badge { color: var(--ok); font-size: .74rem; white-space: nowrap; }

  #controls { grid-column: 1/-1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: rgba(17,25,49,.84); box-shadow: 0 15px 40px rgba(0,0,0,.22); backdrop-filter: blur(18px); }
  #controls .sp { flex: 1; }
  #controls label { display: flex; gap: 7px; align-items: center; padding-left: 5px; }
  #controls select { width: auto; min-height: 38px; padding: 7px 32px 7px 10px; border-radius: 9px; font-size: .78rem; }
  #controls input[type='range'] { min-height: 0; accent-color: var(--acc); box-shadow: none; }
  #controls button { min-height: 40px; padding: 8px 13px; font-size: .82rem; }

  @keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes drift { to { transform: translate3d(3rem, 2rem, 0) scale(1.08); } }

  @media (max-width: 860px) {
    body {
      display: block;
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #gh, #lang { top: 12px; }
    #gh { right: 12px; }
    #lang { right: 64px; width: 195px; max-width: calc(100vw - 88px); }
    #join { margin: 76px auto max(24px, env(safe-area-inset-bottom)); }
    #room {
      width: 100%;
      height: auto;
      min-height: 100dvh;
      overflow: visible;
      grid-template-columns: minmax(0,1fr);
      grid-template-rows: auto minmax(240px, 60vh) auto auto;
      padding: 66px 10px max(10px, env(safe-area-inset-bottom));
    }
    #room header { padding: 4px; }
    #room header .brand { width: 100%; }
    aside { max-height: 145px; }
    #controls { max-height: none; overflow: visible; }
  }
  @media (max-width: 520px) {
    #join { width: calc(100% - 24px); padding: 24px 20px; border-radius: 22px; }
    #join h1 { font-size: 1.85rem; }
    #join > .mut:last-of-type { font-size: .78rem; }
    #room { grid-template-rows: auto minmax(220px, 52vh) auto auto; }
    #room header h2 { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #controls label { width: calc(50% - 5px); justify-content: space-between; }
    #controls label select { min-width: 0; max-width: 105px; }
    #controls label:has(#vol) { width: 100%; }
    #btnLeave { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }

  /* =====================  CONTAS E PERFIL  ===================== */
  body { place-items: safe center; overflow-x: hidden; overflow-y: auto; }

  #accBar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  #accBar .acc-who { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1 1 150px; }
  #accBar .acc-txt { display: grid; min-width: 0; line-height: 1.3; }
  #accBar .acc-txt strong, #accBar .acc-txt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #accBar .acc-hint { flex: 1 1 170px; margin: 0; }
  #accBar button { min-height: 38px; padding: 7px 12px; font-size: .82rem; }
  #inName.locked { opacity: .72; cursor: not-allowed; }

  .av { --s: 36px; flex: 0 0 auto; width: var(--s); height: var(--s); border-radius: 50%; display: inline-grid; place-items: center; overflow: hidden; background: linear-gradient(135deg, var(--acc), var(--cyan)); color: #fff; font: 800 calc(var(--s) * .42)/1 'Manrope', sans-serif; user-select: none; }
  .av img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .who[role='button'] { cursor: pointer; border-radius: 9px; }
  .who[role='button']:hover .nm { text-decoration: underline; }
  .vf { flex: 0 0 auto; color: var(--cyan); font-size: .78rem; font-weight: 800; }

  .dlg { width: min(92vw, 440px); max-height: min(90dvh, 780px); padding: 0; border: 1px solid var(--line); border-radius: 22px; background: var(--card-solid); color: var(--fg); box-shadow: var(--shadow); overflow: auto; }
  .dlg::backdrop { background: rgba(3, 6, 15, .72); backdrop-filter: blur(6px); }
  .dlg-in { display: grid; gap: 14px; padding: 22px; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dlg-head h2 { margin: 0; font: 800 1.25rem/1.15 'Manrope', sans-serif; letter-spacing: -.03em; }
  .dlg .x { flex: 0 0 auto; width: 36px; min-height: 36px; padding: 0; }
  .dlg-form { display: grid; gap: 14px; }
  .dlg label { display: grid; gap: 7px; color: #c8d0e5; font-size: .84rem; font-weight: 600; }
  .dlg textarea { width: 100%; min-height: 92px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; outline: none; resize: vertical; background: rgba(5, 9, 22, .65); color: var(--fg); font: inherit; transition: border-color .2s ease, box-shadow .2s ease; }
  .dlg textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 4px rgba(108,124,255,.13); }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .counter { justify-self: end; margin-top: -8px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: rgba(4, 8, 20, .5); }
  .tabs button { min-height: 38px; border: 0; background: transparent; box-shadow: none; color: var(--mut); }
  .tabs button:hover:not(:disabled) { transform: none; box-shadow: none; color: var(--fg); }
  .tabs button.on { background: var(--surface-hover); color: var(--fg); }
  .oauth { display: grid; gap: 8px; }
  .sep { display: flex; align-items: center; gap: 10px; margin: 0; }
  .sep::before, .sep::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .amsg { margin: 0; font-size: .85rem; font-weight: 700; line-height: 1.45; }
  .amsg:empty { display: none; }
  .amsg.err { color: #ff9bad; }
  .amsg.ok { color: var(--ok); }
  .captcha { display: flex; justify-content: center; min-height: 78px; }
  .linkbtn { min-height: 0; padding: 4px; border: 0; background: none; box-shadow: none; color: var(--mut); font-weight: 600; text-decoration: underline; }
  .linkbtn:hover:not(:disabled) { transform: none; box-shadow: none; color: var(--fg); }

  .pe-banner { position: relative; aspect-ratio: 3 / 1; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(135deg, rgba(108,124,255,.35), rgba(73,217,255,.2)); }
  .pe-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pe-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .pe-actions button { min-height: 34px; padding: 5px 10px; font-size: .76rem; border-radius: 9px; }
  .pe-banner .pe-actions { position: absolute; right: 8px; bottom: 8px; }
  .pe-banner .pe-actions button { background: rgba(7, 11, 24, .78); backdrop-filter: blur(10px); }
  .pe-avrow { position: relative; display: flex; align-items: flex-start; gap: 14px; margin-top: -40px; padding-left: 14px; }
  .pe-avrow .av { --s: 76px; border: 4px solid var(--card-solid); }
  .pe-avrow .pe-actions { margin-top: 46px; }

  .dlg-card .dlg-in { gap: 0; padding: 0; }
  .pc-banner { aspect-ratio: 3 / 1; overflow: hidden; background: linear-gradient(135deg, var(--acc), var(--acc-2)); }
  .pc-banner img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pc-body { display: grid; gap: 4px; padding: 0 20px 22px; }
  .pc-body .av { --s: 84px; margin-top: -42px; border: 4px solid var(--card-solid); }
  .pc-body h3 { margin: 8px 0 0; font: 800 1.3rem/1.15 'Manrope', sans-serif; letter-spacing: -.03em; overflow-wrap: anywhere; }
  .pc-bio { margin: 8px 0 0; color: #d7def0; font-size: .92rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .card-x { position: absolute; top: 10px; right: 10px; z-index: 2; background: rgba(7, 11, 24, .7); }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><span class="orb one"></span><span class="orb two"></span></div>

<select id="lang" aria-label="Idioma / Language">
  <option value="pt-BR">Português (Brasil)</option>
  <option value="en">English</option>
  <option value="pt-PT">Português (Portugal)</option>
</select>

<a id="gh" href="https://github.com/netkkj" target="_blank" rel="noopener" title="https://github.com/netkkj" aria-label="GitHub netkkj">
  <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
  </svg>
</a>

<section id="join">
  <div class="brand" aria-label="NetShare">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2.5" fill="white"/><circle cx="18" cy="6" r="2.5" fill="white"/><circle cx="18" cy="18" r="2.5" fill="white"/><path d="M8.2 10.9 15.7 7M8.2 13.1l7.5 3.9" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></span>
    <span>NetShare</span><span class="brand-dot" aria-hidden="true"></span>
  </div>
  <div class="eyebrow"><span data-i18n="eyebrowA"></span><span>•</span><span id="eyebrowB" data-i18n="eyebrowB"></span></div>
  <div id="accBar" class="hidden"></div>
  <h1 data-i18n="title"></h1>
  <p class="mut" data-i18n="joinIntro"></p>
  <label><span data-i18n="lblName"></span> <input id="inName" maxlength="24" data-i18n-ph="phName" autocomplete="off"></label>
  <label><span data-i18n="lblRoom"></span> <input id="inRoom" maxlength="32" data-i18n-ph="phRoom" autocomplete="off"></label>

function detectLang() {
  try { const s = localStorage.getItem('sala-lang'); if (s && I18N[s]) return s; } catch (e) {}
  const n = (navigator.language || '').toLowerCase();
  return n.startsWith('pt-pt') ? 'pt-PT' : n.startsWith('pt') ? 'pt-BR' : 'en';
}
let lang = detectLang();
function T(k, v) {
  let s = (I18N[lang] && I18N[lang][k]);
  if (s == null) s = I18N['pt-BR'][k];
  if (s == null) s = k;
  if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]);
  return s;
}

let curMsg = { k: null, v: null };
function msg(text) { curMsg = { k: null, v: null }; $('msg').textContent = text || ''; }
function msgK(k, v) { curMsg = { k, v }; $('msg').textContent = T(k, v); }
const msgKey = () => curMsg.k;
let curErr = { k: null, v: null };
function setJoinErr(k, v) { curErr = { k, v }; $('joinErr').textContent = k ? T(k, v) : ''; }

function applyLang() {
  document.documentElement.lang = lang;
  document.title = 'NetShare — ' + T('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
  $('lang').value = lang;
  if (curMsg.k) $('msg').textContent = T(curMsg.k, curMsg.v);
  if (curErr.k) $('joinErr').textContent = T(curErr.k, curErr.v);
  if (typeof updateButtons === 'function') updateButtons();
  if (typeof tiles !== 'undefined') tiles.forEach(t => { updateTileTexts(t); });
  if (typeof lastSig !== 'undefined') lastSig = '';
  if (window.Acc) Acc.refreshTexts();
  if (typeof render === 'function') render();
}
$('lang').onchange = () => {
  lang = $('lang').value;
  try { localStorage.setItem('sala-lang', lang); } catch (e) {}
  applyLang();
};

/* ---------- Carregamento sob demanda do PeerJS ---------- */
const SRI = {};
let peerLoad = null;
function loadPeer() {
  if (window.Peer) return Promise.resolve(true);
  if (peerLoad) return peerLoad;
  peerLoad = new Promise(resolve => {
    const urls = [
      'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
      'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
    ];
    let i = 0;
    const next = () => {
      if (window.Peer) return resolve(true);
      if (i >= urls.length) { peerLoad = null; return resolve(false); }
      const s = document.createElement('script');
      const u = urls[i++];
      s.src = u;
      if (SRI[u]) { s.integrity = SRI[u]; s.crossOrigin = 'anonymous'; }
      s.onload = () => (window.Peer ? resolve(true) : next());
      s.onerror = next;
      document.head.appendChild(s);
    };
    next();
  });
  return peerLoad;
}
$('join').addEventListener('focusin', () => loadPeer(), { once: true });

const TE = new TextEncoder();
const toHex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');

async function deriveRoomKey(room, pass) {

  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: TE.encode('sala-v6|' + room), iterations: 210000 }, base, 256);

}
async function makeProof(nonce, id) {

}

const cleanStr = (s, n) => (typeof s === 'string' ? s : '').replace(/[\u0000-\u001f\u007f-\u009f\u202a-\u202e\u2066-\u2069]/g, '').trim().slice(0, n);

function destroyTile(t) {

  tiles.forEach(destroyTile); tiles.clear();

  const p = peer; peer = null; myId = null; mySlot = -1;

function start() {

function claimSlot(i) {
  if (leaving) return;
  if (i >= MAX_SLOTS) { kickOut('full'); return; }
  let opened = false;
  const me = new Peer(baseId + '_' + i, PEER_OPTS);
  peer = me;

  me.on('open', id => {
    if (me !== peer) return;
    opened = true;
    myId = id; mySlot = i;
    if (window.Acc) Acc.claim(id);
    msgK('searching');
    probe();
    setTimeout(probe, 1000); setTimeout(probe, 3000);
    const tick = () => {
      probeTimer = setTimeout(() => {
        probe();
        if (isOwner()) broadcast({ t: 'owner', id: own.id, epoch: own.epoch });
        if (me === peer && !leaving) tick();
      }, 5000 + Math.random() * 3000);
    };
    tick();
    updateStatus();
    searchTimer = setTimeout(() => {
      if (!people.size) {
        if (!own.id) claimOwner(false);
        if (msgKey() === 'searching') msgK('created');
      }
    }, 3000);
    render();
  });
  me.on('connection', c => {
    if (me !== peer) return;
    if (!isRoomPeer(c.peer)) { try { c.close(); } catch (e) {} return; }
    setupConn(c, false);
  });
  me.on('call', call => { if (me === peer) onCall(call); });

  me.on('error', e => {
    if (me !== peer) return;
    if (e.type === 'unavailable-id') {
      kill(me);
      if (!opened) claimSlot(i + 1);
      else { msgK('reconnecting'); setTimeout(() => { if (!leaving) start(); }, 300); }
      return;
    }
    if (e.type === 'peer-unavailable') {
      const m = /peer (\S+)$/.exec(String(e.message || ''));
      if (m) { const c = dialing.get(m[1]); dialing.delete(m[1]); if (c) { try { c.close(); } catch (_) {} } }
      return;
    }
    if (!opened && ['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) {
      msgK('serverDown');
      kill(me);
      setTimeout(() => claimSlot(i), 2000);
      return;
    }
    msgK('errConn', { e: e.type });
  });
  me.on('disconnected', () => { if (me === peer && !me.destroyed && !leaving) { try { me.reconnect(); } catch (e) {} } });
  me.on('close', () => { if (me === peer && !me._dead && !leaving) { msgK('reconnecting'); setTimeout(() => { if (!leaving) start(); }, 500); } });
}

function wake() {

document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
window.addEventListener('online', wake);

function updateStatus() {
  clearInterval(statusTimer);

    const srv = !peer ? 'srvWait' : (peer.open && !peer.disconnected) ? 'srvOk' : peer.open ? 'srvOff' : 'srvWait';

const sleep = ms => new Promise(r => setTimeout(r, ms));
const ignoreUntil = new Map();
const canDial = id => !!id && !!peer && peer.open && id !== myId && !dialing.has(id)
  && !allConns(id).some(x => x.open && (x.verified || Date.now() - (x.openedAt || 0) < 1500))
  && (ignoreUntil.get(id) || 0) <= Date.now();

let probing = false;
async function probe() {
  if (probing) return;
  probing = true;
  try {
    for (let i = 0; i < MAX_SLOTS; i++) {
      if (leaving || !peer || !peer.open || mySlot < 0) break;
      if (i === mySlot) continue;
      const id = baseId + '_' + i;
      if (!canDial(id)) continue;
      dial(id);
      const t0 = Date.now();
      while (dialing.has(id) && !leaving && Date.now() - t0 < 1500) await sleep(80);
    }
  } finally { probing = false; }
}

function dial(id) {
  if (!canDial(id)) return;
  const c = peer.connect(id, { reliable: true });
  dialing.set(id, c);
  setupConn(c, true);
  // OTIMIZAÇÃO: reduzido de 20s para 6s para desistir rápido de conexões mortas
  setTimeout(() => {
    if (dialing.get(id) !== c) return;
    dialing.delete(id);
    const st = c.peerConnection ? c.peerConnection.iceConnectionState : 'new';
    try { c.close(); } catch (e) {}
    if (st === 'new') { ignoreUntil.set(id, Date.now() + 15000); return; }
    ignoreUntil.set(id, Date.now() + 4000);
    msgK('connFail');
    setTimeout(() => { if (msgKey() === 'connFail') msg(''); }, 8000);
  }, 6000);

/* =====================  CONEXÕES E HANDSHAKE  ===================== */
const MAX_PER_PEER = 3;
const DENIABLE = ['name', 'required', 'open', 'banned', 'wrong'];
const addSpare = (id, c) => { let x = spare.get(id); if (!x) spare.set(id, x = new Set()); x.add(c); };
const allConns = id => { const l = []; const p = conns.get(id); if (p) l.push(p); const x = spare.get(id); if (x) x.forEach(y => { if (y !== p) l.push(y); }); return l; };
const verifiedConn = id => allConns(id).find(x => x.open && x.verified) || null;
const connIds = () => new Set([...conns.keys(), ...spare.keys()]);
const isRoomPeer = id => {
  if (typeof id !== 'string' || !baseId || !id.startsWith(baseId + '_')) return false;
  const r = id.slice(baseId.length + 1);
  return /^\d{1,2}$/.test(r) && +r < MAX_SLOTS;
};
const joinReason = (roomHas, joinerHas) => !joinerHas ? 'required' : !roomHas ? 'open' : 'wrong';

const hasAccepted = () => [...connIds()].some(id => allConns(id).some(x => x.open && x.accepted));
function softKick(reason) {
  if (kickTimer || leaving) return;
  kickTimer = setTimeout(() => { kickTimer = 0; if (!leaving && !hasAccepted()) kickOut(reason); }, 2000);
}

function setupConn(c, outbound) {
  const id = c.peer;
  c.myNonce = rndHex(16);
  c.on('open', () => {
    if (dialing.get(id) === c) dialing.delete(id);
    if (allConns(id).filter(x => x !== c && x.open).length >= MAX_PER_PEER) { try { c.close(); } catch (e) {} return; }
    const cur = conns.get(id);
    if (!cur || cur === c || !cur.open) conns.set(id, c); else addSpare(id, c);
    c.openedAt = Date.now();
    c.vt = setTimeout(() => { if (!c.verified) { try { c.close(); } catch (e) {} } }, 6000);
    
    // OTIMIZAÇÃO: pings encurtados para (800ms, 2s, 4s) acelerando a resposta
    const ping = () => { if (c.open && !c.verified) { try { c.send({ t: 'ch', n: c.myNonce }); } catch (e) {} } };
    ping();
    c.rt = [setTimeout(ping, 800), setTimeout(ping, 2000), setTimeout(ping, 4000)];
  });
  c.on('data', d => { c.q = (c.q || Promise.resolve()).then(() => onData(c, d)).catch(e => console.warn(e)); });
  const gone = () => {
    clearTimeout(c.vt); (c.rt || []).forEach(clearTimeout);
    if (dialing.get(id) === c) dialing.delete(id);
    const x = spare.get(id); if (x) { x.delete(c); if (!x.size) spare.delete(id); }
    if (conns.get(id) !== c) return;
    const alt = allConns(id).find(y => y !== c && y.open && y.verified);
    if (alt) { conns.set(id, alt); return; }
    drop(id);
  };
  c.on('close', gone);
  c.on('error', gone);
}

async function sendHello(c) {
  if (!myId || !c.open) return;
  if (c.sentAge == null) c.sentAge = myAge();
  let proof = '';
  try { if (roomKey) proof = await makeProof(c.theirNonce, myId); } catch (e) { return; }
  if (!c.open || leaving) return;
  let accSid = '';
  if (window.Acc) { try { await Acc.whenClaimed(); } catch (e) {} accSid = Acc.sid(); }
  if (!c.open || leaving) return;
  try {
    const hello = { t: 'hello', name: myName, sharing: !!myStream, kind: myKind, age: c.sentAge, hasPass: !!roomKey, proof,
                    slot: mySlot, ver: APP_VERSION, cid: clientId };
    if (accSid) hello.sid = accSid;
    c.send(hello);
  } catch (e) {}
}

async function onData(c, d) {
  const id = c.peer;
  if (!d || typeof d !== 'object' || typeof d.t !== 'string') return;
  if (d.t === 'ch') {
    if (typeof d.n !== 'string' || d.n.length < 8 || d.n.length > 64) return;
    if (!c.theirNonce) c.theirNonce = d.n;
    if (c.theirNonce === d.n) await sendHello(c);
    return;
  }
  if (d.t === 'hello') return onHello(c, d);
  if (d.t === 'denied') { softKick(DENIABLE.includes(d.reason) ? d.reason : 'wrong'); return; }
  if (!c.verified) return;
  if (d.t === 'state') return onState(c, d);
  if (d.t === 'sharing') {
    const p = people.get(id);
    if (p) {
      p.sharing = !!d.on;
      p.kind = d.on && (d.kind === 'cam' || d.kind === 'screen') ? d.kind : null;
      if (!d.on) hidden.delete(id);
      render();
    }
  } else if (d.t === 'owner') {
    mergeOwner({ id: d.id, epoch: d.epoch }, id);
  } else if (d.t === 'ban') {
    if (id === own.id) {
      const cid = cleanStr(d.cid, 64), nm = norm(cleanStr(d.nm, 24));
      if (cid) bans.add(cid);
      if (nm) bansName.add(nm);
      if ((cid && cid === clientId) || (nm && nm === norm(myName))) kickOut('banned');
    }
  } else if (d.t === 'kicked') {
    if (id === own.id) kickOut(d.ban ? 'banned' : 'kicked');
  }
}

async function onHello(c, d) {
  if (c.helloDone) return;
  c.helloDone = true;
  const id = c.peer;
  const refuse = reason => {
    try { c.send({ t: 'denied', reason }); } catch (e) {}
    setTimeout(() => { try { c.close(); } catch (e) {} }, 300);
  };
  const name = cleanName(d.name), cid = cleanStr(d.cid, 64);
  if (!name || !cid) { try { c.close(); } catch (e) {} return; }
  if (bans.has(cid) || bansName.has(norm(name))) return refuse('banned');

  const theirHas = !!d.hasPass, myHas = !!roomKey;
  let authOk = theirHas === myHas;
  if (authOk && myHas) {
    try { authOk = typeof d.proof === 'string' && (await makeProof(c.myNonce, id)) === d.proof; } catch (e) { authOk = false; }
  }
  if (leaving || !c.open) return;

  const mine = c.sentAge != null ? c.sentAge : myAge();
  const theirs = cleanNum(d.age, 0, 1e12);
  const theyAreOlder = theirs > mine || (theirs === mine && slotOf(id) < mySlot);
  if (!authOk) {
    if (theyAreOlder) softKick(joinReason(theirHas, myHas));
    else refuse(joinReason(myHas, theirHas));
    return;
  }
  if (norm(name) === norm(myName)) {
    if (theyAreOlder) kickOut('name'); else refuse('name');
    return;
  }

  const ver = cleanStr(d.ver, 8);
  if (ver !== APP_VERSION) {
    msgK('oldVersion', { name, ver: ver || '?' });
    setTimeout(() => { if (msgKey() === 'oldVersion') msg(''); }, 10000);
  }
  c.verified = true; c.theyOlder = theyAreOlder;
  clearTimeout(c.vt);
  if (!people.has(id)) {
    people.set(id, { name, sharing: !!d.sharing, kind: d.sharing && (d.kind === 'cam' || d.kind === 'screen') ? d.kind : null,
                     cid, slot: cleanNum(d.slot, 0, MAX_SLOTS), since: performance.now() - theirs });
  }
  if (window.Acc && typeof d.sid === 'string') Acc.verify(id, d.sid);
  const cur = conns.get(id);
  if (cur !== c && !(cur && cur.open && cur.verified)) {

  render();
}

function sendState(c) {
  try { c.send({ t: 'state', own: { id: own.id, epoch: own.epoch }, bans: [...bans].slice(0, 200), bn: [...bansName].slice(0, 200) }); } catch (e) {}
}
function onState(c, d) {
  c.accepted = true;
  const o = d.own;
  if (o && typeof o.id === 'string') mergeOwner({ id: o.id, epoch: o.epoch }, 'hello');
  if (c.peer === own.id) {
    const b = cleanList(d.bans, 200, 64), n = cleanList(d.bn, 200, 24).map(norm);
    if (b.includes(clientId) || n.includes(norm(myName))) { kickOut('banned'); return; }
    b.forEach(x => bans.add(x)); n.forEach(x => bansName.add(x));
  }
  if (!own.id && c.theyOlder === false) claimOwner(false);
}

function kickOut(reason) {
  const map = { name:'eName', required:'eRequired', open:'eOpen', full:'eFull', banned:'eBanned', kicked:'eKicked', wrong:'eWrong' };
  leaveRoom();
  setJoinErr(map[reason] || 'eWrong', { n: MAX_SLOTS });
}

function broadcast(m) { connIds().forEach(id => { const c = verifiedConn(id); if (c) { try { c.send(m); } catch (e) {} } }); }
function drop(id) {
  conns.delete(id); people.delete(id); pendingCalls.delete(id); hidden.delete(id);
  const c = calls.get(id); if (c) c.close(); calls.delete(id);
  removeTile(id);

/* =====================  DONO DA SALA  ===================== */
function mergeOwner(o, sender) {
  if (!o || typeof o.id !== 'string' || o.id.length > 80 || !Number.isSafeInteger(o.epoch) || o.epoch < 0 || o.epoch > 1e6) return;
  if (o.id !== myId && !people.has(o.id)) return;
  if (sender !== 'hello') {
    if (sender !== o.id && sender !== own.id) return;
    const viaOwner = sender === own.id;
    const contest = o.epoch === own.epoch && performance.now() < ownerWindow;
    if (!viaOwner && own.id && !contest) return;
    if (!viaOwner && o.epoch > own.epoch + 1) return;
  }
  let take = false;
  if (o.epoch > own.epoch) take = true;
  else if (o.epoch === own.epoch && o.id !== own.id) take = !own.id || slotOf(o.id) < slotOf(own.id);
  if (!take) return;
  const prev = own.id;
  own = { id: o.id, epoch: o.epoch };
  ownerChanged(prev, true);
}
function ownerChanged(prev, announce) {
  clearTimeout(heirTimer);
  if (announce && prev !== own.id) {
    if (own.id === myId) msgK('youOwner');
    else if (people.get(own.id) && prev) msgK('newOwner', { name: people.get(own.id).name });
    setTimeout(() => { if (['youOwner', 'newOwner'].includes(msgKey())) msg(''); }, 4000);
  }
  render();
}
function claimOwner(announce) {
  if (!myId) return;
  const prev = own.id;
  own = { id: myId, epoch: own.epoch + 1 };
  broadcast({ t: 'owner', id: own.id, epoch: own.epoch });
  ownerChanged(prev, announce);
}
function ownerLeft() {
  own = { id: null, epoch: own.epoch };
  ownerWindow = performance.now() + 5000;
  clearTimeout(heirTimer);
  if (!myId) return;
  const cands = [{ id: myId, since: joinedAt, slot: mySlot }];
  people.forEach((p, id) => cands.push({ id, since: p.since, slot: p.slot != null ? p.slot : slotOf(id) }));
  cands.sort((a, b) => a.since - b.since || a.slot - b.slot);
  if (cands[0].id === myId) { claimOwner(true); return; }
  heirTimer = setTimeout(() => {
    if (own.id || leaving || !peer) return;
    const lowest = [...cands].filter(c => c.id === myId || people.has(c.id)).sort((a, b) => a.slot - b.slot)[0];
    if (lowest && lowest.id === myId) claimOwner(true);
  }, 1500);
}
function transferOwner(id) {
  if (!isOwner()) return;
  const p = people.get(id); if (!p) return;
  if (!confirm(T('confirmOwner', { name: p.name }))) return;
  own = { id, epoch: own.epoch + 1 };
  broadcast({ t: 'owner', id: own.id, epoch: own.epoch });
  ownerChanged(myId, false);
}
function kickPerson(id, ban) {
  if (!isOwner()) return;
  const p = people.get(id), c = verifiedConn(id); if (!p || !c) return;
  if (!confirm(T(ban ? 'confirmBan' : 'confirmKick', { name: p.name }))) return;
  if (ban) {
    bans.add(p.cid); bansName.add(norm(p.name));
    broadcast({ t: 'ban', cid: p.cid, nm: norm(p.name) });
  }
  try { c.send({ t: 'kicked', ban: !!ban }); } catch (e) {}
  setTimeout(() => { allConns(id).forEach(x => { try { x.close(); } catch (e) {} }); }, 300);
}

/* =====================  RECEBER VÍDEO  ===================== */
function onCall(call) {
  if (!isRoomPeer(call.peer)) { try { call.close(); } catch (e) {} return; }
  if (verifiedConn(call.peer)) { answerCall(call); return; }
  pendingCalls.set(call.peer, call);
  setTimeout(() => {
    if (pendingCalls.get(call.peer) === call) { pendingCalls.delete(call.peer); try { call.close(); } catch (e) {} }
  }, 6000);
}
function answerCall(call) {
  call.answer(undefined, { sdpTransform: tuneSdp });
  call.on('stream', s => showTile(call.peer, s, call));
  call.on('close', () => { const t = tiles.get(call.peer); if (t && t.call === call) removeTile(call.peer); });
}

/* =====================  QUALIDADE DE VÍDEO  ===================== */
const DIMS = { 720: [1280, 720], 1080: [1920, 1080], 1440: [2560, 1440], 2160: [3840, 2160] };
function qualitySettings() {
  const fps = +$('fps').value;
  const res = +$('res').value;
  const [w, h] = DIMS[res] || DIMS[720];
  const bpp = fps <= 30 ? 0.07 : fps <= 60 ? 0.06 : 0.035;
  const base = Math.min(40e6, Math.max(1.5e6, w * h * fps * bpp));
  return { fps, res, w, h, base };
}

function tuneSdp(sdp) {
  if (!IS_CHROMIUM) return sdp;
  try {
    const lines = sdp.split('\r\n');
    const pts = new Set(), withFmtp = new Set();
    lines.forEach(l => {
      let m = l.match(/^a=rtpmap:(\d+) (VP8|VP9|H264|AV1)\//);
      if (m) pts.add(m[1]);
      m = l.match(/^a=fmtp:(\d+) /);
      if (m) withFmtp.add(m[1]);
    });
    const extra = 'x-google-start-bitrate=2500;x-google-min-bitrate=600;x-google-max-bitrate=40000';
    const out = [];
    lines.forEach(l => {
      let m = l.match(/^a=fmtp:(\d+) (.*)$/);
      if (m && pts.has(m[1]) && !l.includes('x-google-')) { out.push(l + ';' + extra); return; }
      out.push(l);
      m = l.match(/^a=rtpmap:(\d+) /);
      if (m && pts.has(m[1]) && !withFmtp.has(m[1])) out.push('a=fmtp:' + m[1] + ' ' + extra);
    });
    return out.join('\r\n');
  } catch (e) { return sdp; }
}

function applyQuality() {
  if (!myStream) return;
  const q = qualitySettings();
  const n = Math.max(1, calls.size);
  const per = Math.round(Math.max(1.2e6, Math.min(q.base, q.base * 1.6 / n)));
  calls.forEach(c => {
    const pc = c.peerConnection; if (!pc) return;
    pc.getSenders().forEach(s => {
      if (!s.track || s.track.kind !== 'video') return;
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      const e = p.encodings[0];
      e.maxBitrate = per;
      e.maxFramerate = q.fps;
      const w = (s.track.getSettings && s.track.getSettings().width) || q.w;
      e.scaleResolutionDownBy = Math.max(1, w / q.w);
      p.degradationPreference = (myKind === 'screen' && q.fps <= 30) ? 'maintain-resolution'
        : (q.fps >= 60 ? 'maintain-framerate' : 'balanced');
      s.setParameters(p).catch(() => {});
    });
  });
}
let qTimers = [];
function scheduleQuality() {
  qTimers.forEach(clearTimeout);
  qTimers = [setTimeout(applyQuality, 1000), setTimeout(applyQuality, 3000)];
}

/* =====================  TRANSMISSÃO E ÁUDIO  ===================== */
const canShareScreen = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
const canUseCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

let hasAudio = false;
function audioKey() { return hasAudio ? 'audOn' : 'audNone'; }

function updateLocalNote() {
  const t = tiles.get('me');
  if (!t || !myStream) return;
  if (t.note) {
    const vt = myStream.getVideoTracks()[0]; if (!vt) return;
    const s = vt.getSettings ? vt.getSettings() : {};
    const info = (s.width || '?') + '×' + (s.height || '?') + ' · ' + Math.round(s.frameRate || 0) + ' FPS · ' + T(audioKey());
    const head = calls.size === 0 ? T('sharingReady') : calls.size === 1 ? T('sharing1') : T('sharingN', { n: calls.size });
    t.note.textContent = head + '\n' + info;
  }
}

function callPeer(id) {
  if (!myStream || !peer || calls.has(id)) return;
  const c = peer.call(id, myStream, { sdpTransform: tuneSdp });
  calls.set(id, c);
  c.on('close', () => {
    if (calls.get(id) === c) { calls.delete(id); updateLocalNote(); scheduleQuality(); }
  });
  updateLocalNote();
  scheduleQuality();
}

if (!canShareScreen) $('btnScreen').disabled = true;
$('facing').onchange = () => { if (myKind === 'cam') share('cam'); };

async function share(kind) {
  if (kind === 'screen' && !canShareScreen) { msgK('cantScreen'); return; }
  if (kind === 'cam' && !canUseCamera) { msgK('cantCam'); return; }
  if (myStream) stopShare();
  const q = qualitySettings();
  const frameRate = { ideal: q.fps, max: q.fps };
  let stream, camAudioFailed = false;
  try {
    if (kind === 'screen') {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { cursor: 'always', frameRate, width: { ideal: q.w, max: q.w }, height: { ideal: q.h, max: q.h } },
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, restrictOwnAudio: true },
        systemAudio: 'include'
      });
    } else {
      const video = { frameRate, width: { ideal: q.w }, height: { ideal: q.h }, facingMode: { ideal: $('facing').value } };
      try { stream = await navigator.mediaDevices.getUserMedia({ video, audio: true }); }
      catch (e) { camAudioFailed = true; stream = await navigator.mediaDevices.getUserMedia({ video }); }
    }
  } catch (e) { msgK('startFail', { e: e.message }); return; }
  myStream = stream;
  myKind = kind;
  hasAudio = stream.getAudioTracks().length > 0;
  if (kind === 'screen' && !hasAudio) msgK('noSysAudio');
  else if (kind === 'cam' && !hasAudio && camAudioFailed) msgK('camNoAudio');
  else msg('');
  setTimeout(() => { if (['camNoAudio', 'noSysAudio'].includes(msgKey())) msg(''); }, 6000);

  const vt = stream.getVideoTracks()[0];
  vt.contentHint = kind === 'screen' ? (q.fps >= 60 ? 'motion' : 'detail') : 'motion';
  vt.onended = () => stopShare();
  showTile('me', myStream, null, true);
  connIds().forEach(id => { if (verifiedConn(id)) callPeer(id); });
  broadcast({ t: 'sharing', on: true, kind });
  updateLocalNote();
  updateButtons(); render();
}

function stopShare() {
  if (!myStream) return;
  const s = myStream;
  myStream = null; myKind = null;
  s.getTracks().forEach(t => { t.onended = null; t.stop(); });
  hasAudio = false;
  const list = [...calls.values()]; calls.clear(); list.forEach(c => c.close());
  removeTile('me');
  broadcast({ t: 'sharing', on: false });
  updateButtons(); render();
}

let warnTimer;
async function qualityChanged() {
  const q = qualitySettings();
  if (q.res >= 1440 || q.fps > 60) {
    msgK('qualityHigh');
    clearTimeout(warnTimer); warnTimer = setTimeout(() => { if (msgKey() === 'qualityHigh') msg(''); }, 5000);
  }
  if (!myStream) return;
  const vt = myStream.getVideoTracks()[0];
  try {
    await vt.applyConstraints({
      frameRate: { ideal: q.fps, max: q.fps },
      width: { ideal: q.w, max: q.w }, height: { ideal: q.h, max: q.h }
    });
  } catch (e) {}
  vt.contentHint = myKind === 'screen' ? (q.fps >= 60 ? 'motion' : 'detail') : 'motion';
  applyQuality();
  setTimeout(updateLocalNote, 500);
}
$('fps').onchange = qualityChanged;
$('res').onchange = qualityChanged;

$('btnLink').onclick = async () => {
  const link = location.href.split('#')[0] + '#' + encodeURIComponent($('roomName').textContent);
  try { await navigator.clipboard.writeText(link); msgK('linkCopied'); }
  catch (e) { prompt(T('copyPrompt'), link); }
  setTimeout(() => { if (msgKey() === 'linkCopied') msg(''); }, 2500);
};
$('btnScreen').onclick = () => share('screen');
$('btnCam').onclick = () => share('cam');
$('btnStop').onclick = stopShare;

function leaveRoom() {
  stopShare();
  leaving = true;
  closeAll(); resetState();
  msg('');
  $('room').classList.add('hidden');
  $('join').classList.remove('hidden');
}
$('btnLeave').onclick = leaveRoom;
window.addEventListener('beforeunload', () => { leaving = true; closeAll(); });

function updateButtons() {
  $('btnStop').disabled = !myStream;
  $('btnScreen').textContent = !canShareScreen ? T('btnScreenNA') : myKind === 'screen' ? T('btnScreenRe') : T('btnScreen');
  $('btnCam').textContent = myKind === 'cam' ? T('btnCamRe') : T('btnCam');
}

/* =====================  INTERFACE  ===================== */
let masterVol = (() => {
  try { const v = parseFloat(localStorage.getItem('sala-vol')); return isNaN(v) ? 1 : Math.min(1, Math.max(0, v)); }
  catch (e) { return 1; }
})();
function applyVolume(t) {
  try { t.video.volume = Math.min(1, Math.max(0, masterVol * (t.vol == null ? 1 : t.vol))); } catch (e) {}
}
$('vol').value = Math.round(masterVol * 100);
$('vol').oninput = () => {
  masterVol = $('vol').value / 100;
  try { localStorage.setItem('sala-vol', String(masterVol)); } catch (e) {}
  tiles.forEach(t => { if (!t.local) applyVolume(t); });
};

function updateSoundBtn(t) {
  if (!t.snd) return;
  t.snd.textContent = t.video.muted ? '🔇 ' + T('soundOn') : '🔊 ' + T('soundOff');
}
function updateTileTexts(t) {
  if (t.hbtn) t.hbtn.textContent = '🙈 ' + T('hideBtn');
  if (t.vslider) t.vslider.title = T('volTile');
  updateSoundBtn(t);
}

function startRemotePlayback(t) {
  const v = t.video;
  v.muted = false;
  const pr = v.play();
  if (pr && pr.catch) pr.catch(() => {
    v.muted = true;
    v.play().catch(() => {});
  });
}

function showTile(id, stream, call, isLocal) {
  let t = tiles.get(id);
  if (!t) {
    const el = document.createElement('div'); el.className = 'tile';
    const video = document.createElement('video'); video.autoplay = true; video.playsInline = true;
    const label = document.createElement('div'); label.className = 'label';
    el.append(video);
    t = { el, video, label, call: null, stream: null, note: null, snd: null, hbtn: null, noPreview: false, timer: 0, fps: 0, res: '', lastFrames: 0, lastT: 0, created: performance.now(), userMuted: false, local: !!isLocal, vol: 1, vslider: null };
    if (isLocal && myKind === 'screen') {
      t.noPreview = true;
      t.note = document.createElement('div'); t.note.className = 'note';
      el.append(t.note);
    }
    el.append(label);
    if (!isLocal) {
      t.note = document.createElement('div'); t.note.className = 'note hidden';
      t.note.style.pointerEvents = 'none';
      el.append(t.note);
      el.onclick = () => { t.video.play().catch(() => {}); };
      t.snd = document.createElement('button'); t.snd.className = 'tbtn snd';
      t.snd.onclick = e => {
        e.stopPropagation();
        t.video.muted = !t.video.muted; t.userMuted = t.video.muted;
        if (!t.video.muted) t.video.play().catch(() => {});
        updateSoundBtn(t);
      };
      video.addEventListener('volumechange', () => updateSoundBtn(t));
      el.append(t.snd);
      t.hbtn = document.createElement('button'); t.hbtn.className = 'tbtn hide';
      t.hbtn.onclick = e => { e.stopPropagation(); toggleHide(id); };
      el.append(t.hbtn);
      t.vslider = document.createElement('input'); t.vslider.type = 'range'; t.vslider.className = 'tvol';
      t.vslider.min = 0; t.vslider.max = 100; t.vslider.value = 100;
      t.vslider.oninput = () => { t.vol = t.vslider.value / 100; applyVolume(t); };
      t.vslider.onclick = e => e.stopPropagation();
      t.vslider.ondblclick = e => e.stopPropagation();
      el.append(t.vslider);
      applyVolume(t);
    }
    el.ondblclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen(); };
    {
      let tmr = 0, down = false;
      const busy = () => down || el.querySelector('.tbtn:hover, .tvol:hover');
      const hideUi = () => { if (busy()) { tmr = setTimeout(hideUi, 1000); return; } el.classList.remove('ui'); };
      const showUi = () => { el.classList.add('ui'); clearTimeout(tmr); tmr = setTimeout(hideUi, 2500); };
      el.addEventListener('pointermove', showUi);
      el.addEventListener('pointerdown', () => { down = true; showUi(); });
      el.addEventListener('pointerup', () => { down = false; showUi(); });
      el.addEventListener('pointercancel', () => { down = false; });
      el.addEventListener('pointerleave', () => { if (!down) { clearTimeout(tmr); el.classList.remove('ui'); } });
    }
    if (hidden.has(id)) el.classList.add('hidden');
    $('grid').append(el);
    tiles.set(id, t);
    updateTileTexts(t);
    if (!isLocal) {
      t.lastT = performance.now();
      t.timer = setInterval(() => {
        if (document.hidden) { t.lastT = performance.now(); return; }
        const v = t.video, q = v.getVideoPlaybackQuality && v.getVideoPlaybackQuality();
        const now = performance.now();
        if (q) { t.fps = Math.round((q.totalVideoFrames - t.lastFrames) * 1000 / (now - t.lastT)); t.lastFrames = q.totalVideoFrames; }
        t.lastT = now;
        t.res = v.videoWidth ? v.videoWidth + '×' + v.videoHeight : '';
        if (t.note) {
          const stuck = !v.videoWidth || v.paused;
          const waited = now - t.created > 3000;
          t.note.textContent = v.paused && v.videoWidth ? T('pausedImg') : T('loadingImg');
          t.note.classList.toggle('hidden', !(stuck && waited));
          if (v.paused && v.videoWidth && !hidden.has(id)) v.play().catch(() => {});
        }
        render();
      }, 2000);
    }
  }
  t.stream = stream;
  if (!t.noPreview && t.video.srcObject !== stream) {
    t.video.srcObject = stream;
    if (isLocal) { t.video.muted = true; t.video.play().catch(() => {}); }
    else { if (t.userMuted) { t.video.muted = true; t.video.play().catch(() => {}); } else startRemotePlayback(t); }
  }
  t.call = call;
  render();
}
function removeTile(id) {
  const t = tiles.get(id);
  if (t) { destroyTile(t); tiles.delete(id); }
  render();
}

function toggleHide(id) {
  if (hidden.has(id)) hidden.delete(id); else hidden.add(id);
  const t = tiles.get(id);
  if (t) t.el.classList.toggle('hidden', hidden.has(id));
  render();
}

let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; doRender(); });
}
window.addEventListener('resize', render);

let lastSig = '';
function renderPeople() {
  $('count').textContent = people.size + 1;
  const list = [...people].map(([id, p]) => [id, p.name, p.sharing ? 1 : 0, p.kind || '', p.prof ? [p.prof.username, p.prof.avatar_path, p.prof.bio] : 0]);
  const sig = JSON.stringify([lang, own.id, myId, myName, !!myStream, myKind, [...hidden], list, isOwner(), window.Acc ? Acc.sigKey() : '']);
  if (sig === lastSig) return;
  lastSig = sig;

  const ul = $('people'); ul.textContent = '';
  const mkBtn = (txt, cls, fn) => { const b = document.createElement('button'); b.textContent = txt; if (cls) b.className = cls; b.onclick = fn; return b; };
  const row = (id, name, sharing, kind, you) => {
    const li = document.createElement('li');
    const top = document.createElement('div'); top.className = 'prow';
    const n = document.createElement('span'); n.className = 'nm';
    const crown = id && own.id === id;
    n.textContent = (crown ? '👑 ' : '') + name + (you ? ' (' + T('you') + ')' : '');
    if (crown) n.title = T('owner');
    if (window.Acc && Acc.enabled) {
      const prof = you ? Acc.myProfile() : (people.get(id) || {}).prof;
      const who = document.createElement('span'); who.className = 'who';
      who.append(Acc.avatar(prof || { display_name: name }, 28), n);
      if (prof) {
        const vf = document.createElement('span'); vf.className = 'vf'; vf.textContent = '✓';
        who.append(vf);
        who.setAttribute('role', 'button'); who.tabIndex = 0; who.title = T('cardVerified');
        const open = () => Acc.showCard(prof);
        who.onclick = open;
        who.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
      }
      top.append(who);
    } else top.append(n);
    if (sharing) {
      const b = document.createElement('span'); b.className = 'badge';
      b.textContent = kind === 'cam' ? T('badgeCam') : T('badgeScreen');
      top.append(b);
    }
    li.append(top);
    if (!you) {
      const acts = document.createElement('div'); acts.className = 'acts';
      if (sharing) acts.append(mkBtn(hidden.has(id) ? T('showScreen') : T('hideScreen'), 'sec', () => toggleHide(id)));
      if (isOwner()) {
        acts.append(mkBtn(T('kick'), 'sec', () => kickPerson(id, false)));
        acts.append(mkBtn(T('ban'), 'bad', () => kickPerson(id, true)));
        acts.append(mkBtn(T('makeOwner'), 'sec', () => transferOwner(id)));
      }
      if (acts.children.length) li.append(acts);
    }
    ul.append(li);
  };
  row(myId, myName || '', !!myStream, myKind, true);
  people.forEach((p, id) => row(id, p.name, p.sharing, p.kind, false));
}

function doRender() {
  renderPeople();

  tiles.forEach((t, id) => {
    const me = id === 'me';
    const name = me ? myName + ' (' + T('you') + ')' : (people.get(id) || {}).name || '...';
    const kind = me ? myKind : (people.get(id) || {}).kind;
    let text = name + ' — ' + (kind === 'cam' ? T('tagCam') : T('tagScreen'));
    if (me) text += ' · ' + T(audioKey());
    else {
      if (t.res) text += ' · ' + t.res;
      if (t.fps) text += ' · ' + t.fps + ' fps';
      if (t.stream && t.stream.getAudioTracks().length === 0) text += ' · ' + T('noAudio');
    }
    if (t.label.textContent !== text) t.label.textContent = text;
  });

  const n = [...tiles.keys()].filter(id => !hidden.has(id)).length;
  $('empty').classList.toggle('hidden', n > 0);
  $('empty').textContent = tiles.size > 0 ? T('emptyHidden') : T('emptyNone');
  let cols = 1, rows = 1;
  if (n > 0) {
    cols = window.matchMedia('(max-width:800px)').matches ? 1 : Math.ceil(Math.sqrt(n));
    rows = Math.ceil(n / cols);
  }
  $('grid').style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
  $('grid').style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
}

applyLang();
</script>

  cardVerified:'Verified account', cardNoBio:'No bio.'
},
'pt-PT': {
  accPass:'Palavra-passe', accPassNew:'Nova palavra-passe', accForgot:'Esqueci-me da palavra-passe',
  accSignOut:'Terminar sessão', accSignIn:'Iniciar sessão ou criar conta', accTitleIn:'Iniciar sessão', accTabIn:'Iniciar sessão', accSubmitIn:'Iniciar sessão',
  accBadCreds:'E-mail ou palavra-passe incorretos.', accWeakPass:'Use uma palavra-passe com pelo menos 8 caracteres.',
  accSetPass:'Definir nova palavra-passe', accSaveNewPass:'Guardar nova palavra-passe', accPassChanged:'Palavra-passe alterada.',
  pfAvatar:'Alterar foto', pfBanner:'Alterar banner', pfSave:'Guardar perfil', pfSaving:'A guardar...', pfBio:'Descrição'
}
};
for (const l of Object.keys(ACC_I18N)) Object.assign(I18N[l], ACC_I18N[l]);

window.Acc = (() => {
  const base = SB_URL.replace(/\/+$/, '');
  const enabled = /^https:\/\/[^\s/]+$/i.test(base) && !/SEU-PROJETO/i.test(base) && SB_KEY.length > 30 && !/SUA-CHAVE/i.test(SB_KEY);
  const PATH_RE = /^[0-9a-f-]{36}\/[A-Za-z0-9._-]{1,80}$/;
  const USER_RE = /^[a-z0-9_]{3,20}$/;
  const BIO_CTRL = /[\u0000-\u0009\u000b-\u001f\u007f-\u009f\u202a-\u202e\u2066-\u2069]/g;
  const LIMITS = { avatars: 2 * 1024 * 1024, banners: 4 * 1024 * 1024 };
  const PROVIDERS = { discord: 'Discord', google: 'Google', github: 'GitHub' };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const bg = p => { Promise.resolve(p).catch(() => {}); };
  const redirectUrl = () => location.origin + location.pathname;

  let sb = null, session = null, me = null;
  let sid = '', claimedId = null, claimP = null, hb = 0;
  let guestName = '', mode = 'in', pend = null;
  let capId = null, capToken = '', capLoad = null;
  const capOn = !!SB_HCAPTCHA;
  let resolveReady; const ready = new Promise(r => { resolveReady = r; });

  const api = { enabled };

  /* ---------- helpers de perfil e imagem ---------- */
  const imgUrl = (bucket, path) =>
    (typeof path === 'string' && PATH_RE.test(path)) ? base + '/storage/v1/object/public/' + bucket + '/' + path : null;
  const firstChar = s => ([...String(s || '').trim()][0] || '?').toUpperCase();

  function cleanProfile(r) {
    if (!r || typeof r !== 'object') return null;
    const dn = cleanStr(r.display_name, 24);
    if (!dn) return null;
    return {
      username: typeof r.username === 'string' && USER_RE.test(r.username) ? r.username : '',
      display_name: dn,
      bio: (typeof r.bio === 'string' ? r.bio : '').replace(BIO_CTRL, '').slice(0, 200),
      avatar_path: PATH_RE.test(r.avatar_path || '') ? r.avatar_path : null,
      banner_path: PATH_RE.test(r.banner_path || '') ? r.banner_path : null
    };
  }

  function avatar(p, size, forceUrl) {
    const s = document.createElement('span');
    s.className = 'av';
    s.style.setProperty('--s', size + 'px');
    const fb = () => { s.textContent = firstChar(p && (p.display_name || p.username)); };
    const u = forceUrl !== undefined ? forceUrl : (p && imgUrl('avatars', p.avatar_path));
    if (u) {
      const i = new Image();
      i.alt = ''; i.decoding = 'async'; i.referrerPolicy = 'no-referrer';
      i.onerror = () => { i.remove(); fb(); };
      i.src = u;
      s.append(i);
    } else fb();
    return s;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function btn(key, cls, fn) {
    const b = el('button', cls || '');
    b.type = 'button';
    b.dataset.i18n = key;
    b.textContent = T(key);
    b.onclick = fn;
    return b;
  }
  const setI18n = (node, key) => { node.dataset.i18n = key; node.textContent = T(key); };
  const msgTo = (id, key, kind, vars) => {
    const n = $(id);
    n.className = 'amsg' + (kind ? ' ' + kind : '');
    n.textContent = key ? T(key, vars) : '';
  };

  /* ---------- carregar o SDK ---------- */
  function loadSDK() {
    if (window.supabase && window.supabase.createClient) return Promise.resolve(true);
    return new Promise(resolve => {
      const urls = [
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
        'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'
      ];
      let i = 0;
      const next = () => {
        if (window.supabase && window.supabase.createClient) return resolve(true);
        if (i >= urls.length) return resolve(false);
        const s = document.createElement('script');
        s.src = urls[i++];
        s.onload = () => (window.supabase && window.supabase.createClient ? resolve(true) : next());
        s.onerror = next;
        document.head.appendChild(s);
      };
      next();
    });
  }

  /* ---------- sessão e perfil próprio ---------- */
  async function loadMe() {
    if (!session) { me = null; return; }
    try {
      const { data, error } = await sb.from('profiles')
        .select('username,display_name,bio,avatar_path,banner_path')
        .eq('id', session.user.id).maybeSingle();
      me = error ? null : cleanProfile(data);
    } catch (e) { me = null; }
  }

  function paint() {
    if (!sb) return;
    const bar = $('accBar');
    bar.classList.remove('hidden');
    bar.textContent = '';
    const inName = $('inName');
    if (session && me) {
      const who = el('div', 'acc-who');
      const t = el('div', 'acc-txt');
      t.append(el('strong', '', me.display_name), el('span', 'mut', me.username ? '@' + me.username : ''));
      who.append(avatar(me, 40), t);
      bar.append(who, btn('accEdit', 'sec', openProfile), btn('accSignOut', 'sec', signOut));
      if (!inName.readOnly) guestName = inName.value;
      inName.value = me.display_name;
      inName.readOnly = true;
      inName.classList.add('locked');
    } else if (session) {
      bar.append(el('span', 'mut acc-hint', session.user.email || ''), btn('accSignOut', 'sec', signOut));
    } else {
      if (inName.readOnly) inName.value = guestName;
      inName.readOnly = false;
      inName.classList.remove('locked');
      const h = el('p', 'mut acc-hint'); h.dataset.i18n = 'accGuestHint'; h.textContent = T('accGuestHint');
      bar.append(h, btn('accSignIn', '', () => openAuth('in')));
    }
    if (window.Srv) Srv.onAuth(session && me ? session.user.id : null);
    if (typeof render === 'function') render();
  }

  async function signOut() {
    release();
    try { await sb.auth.signOut(); } catch (e) {}
  }

  /* ---------- diálogo de login / cadastro ---------- */
  function buildOauth() {
    const row = $('oauthRow');
    row.textContent = '';
    SB_OAUTH.filter(p => PROVIDERS[p]).forEach(p => {
      const b = el('button', 'sec', T('accWith', { p: PROVIDERS[p] }));
      b.type = 'button';
      b.onclick = () => oauth(p);
      row.append(b);
    });
  }

  /* ---------- CAPTCHA (hCaptcha) ---------- */
  function loadCaptcha() {
    if (!capOn) return Promise.resolve(false);
    if (window.hcaptcha) return Promise.resolve(true);
    if (capLoad) return capLoad;
    capLoad = new Promise(resolve => {
      window.__hcLoaded = () => resolve(!!window.hcaptcha);
      const sc = document.createElement('script');
      sc.src = 'https://js.hcaptcha.com/1/api.js?render=explicit&onload=__hcLoaded';
      sc.async = true; sc.defer = true;
      sc.onerror = () => { capLoad = null; resolve(false); };
      document.head.appendChild(sc);
    });
    return capLoad;
  }
  async function showCaptcha() {
    const box = $('captchaBox');
    const need = capOn && mode !== 'reset';
    box.classList.toggle('hidden', !need);
    if (!need) return;
    if (!(await loadCaptcha())) return msgTo('authMsg', 'accCaptchaFail', 'err');
    if (capId === null) {
      capId = window.hcaptcha.render(box, {
        sitekey: SB_HCAPTCHA, theme: 'dark',
        callback: t => { capToken = t; },
        'expired-callback': () => { capToken = ''; },
        'error-callback': () => { capToken = ''; }
      });
    }
  }
  function resetCaptcha() {
    capToken = '';
    if (capId !== null && window.hcaptcha) { try { window.hcaptcha.reset(capId); } catch (e) {} }
  }
  const capOpts = () => (capOn ? { captchaToken: capToken } : {});

  function setMode(m) {
    mode = m;
    $('tabIn').classList.toggle('on', m === 'in');
    $('tabUp').classList.toggle('on', m === 'up');
    $('authTabs').classList.toggle('hidden', m === 'reset');
    const showOauth = m !== 'reset' && SB_OAUTH.some(p => PROVIDERS[p]);
    $('oauthRow').classList.toggle('hidden', !showOauth);
    $('oauthSep').classList.toggle('hidden', !showOauth);
    $('lblUser').classList.toggle('hidden', m !== 'up');
    $('lblEmail').classList.toggle('hidden', m === 'reset');
    $('authForgot').classList.toggle('hidden', m !== 'in');
    $('auPass').autocomplete = m === 'in' ? 'current-password' : 'new-password';
    setI18n($('authTitle'), m === 'up' ? 'accTitleUp' : m === 'reset' ? 'accSetPass' : 'accTitleIn');
    setI18n($('lblPass'), m === 'reset' ? 'accPassNew' : 'accPass');
    setI18n($('authSubmit'), m === 'up' ? 'accSubmitUp' : m === 'reset' ? 'accSaveNewPass' : 'accSubmitIn');
    msgTo('authMsg', null);
    if ($('dlgAuth').open) showCaptcha(); else $('captchaBox').classList.toggle('hidden', !(capOn && m !== 'reset'));
  }

  function openAuth(m) {
    if (!sb) return;
    setMode(m || 'in');
    $('auPass').value = '';
    if (!$('dlgAuth').open) $('dlgAuth').showModal();
    showCaptcha();
  }

  const validEmail = s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
  function authError(error) {
    const m = String(error && error.message || '').toLowerCase();
    if (m.includes('invalid login')) return ['accBadCreds'];
    if (m.includes('not confirmed')) return ['accNotConfirmed'];
    if (m.includes('password') && (m.includes('least') || m.includes('weak') || m.includes('short'))) return ['accWeakPass'];
    return ['accErr', { e: (error && error.message) || String(error) }];
  }

  async function oauth(provider) {
    try { sessionStorage.setItem('sala-pending-room', $('inRoom').value); } catch (e) {}
    const { error } = await sb.auth.signInWithOAuth({ provider, options: { redirectTo: redirectUrl() } });
    if (error) { const [k, v] = authError(error); msgTo('authMsg', k, 'err', v); }
  }

  async function onAuthSubmit(e) {
    e.preventDefault();
    if (!sb) return;
    const email = $('auEmail').value.trim();
    const pass = $('auPass').value;
    msgTo('authMsg', null);
    if (mode !== 'reset' && !validEmail(email)) return msgTo('authMsg', 'accBadEmail', 'err');
    if (pass.length < 8) return msgTo('authMsg', 'accWeakPass', 'err');
    const un = $('auUser').value.trim().toLowerCase();
    if (mode === 'up' && un && !USER_RE.test(un)) return msgTo('authMsg', 'accBadUser', 'err');

    if (capOn && mode !== 'reset' && !capToken) return msgTo('authMsg', 'accCaptcha', 'err');

    const submit = $('authSubmit');
    submit.disabled = true;
    try {
      if (mode === 'reset') {
        const { error } = await sb.auth.updateUser({ password: pass });
        if (error) { const [k, v] = authError(error); return msgTo('authMsg', k, 'err', v); }
        msgTo('authMsg', 'accPassChanged', 'ok');
        setTimeout(() => $('dlgAuth').close(), 1200);
      } else if (mode === 'up') {
        const { data, error } = await sb.auth.signUp({
          email, password: pass,
          options: { data: un ? { username: un } : {}, emailRedirectTo: redirectUrl(), ...capOpts() }
        });
        if (error) { const [k, v] = authError(error); return msgTo('authMsg', k, 'err', v); }
        if (!data.session) msgTo('authMsg', 'accConfirm', 'ok');
        else $('dlgAuth').close();
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password: pass, options: capOpts() });
        if (error) { const [k, v] = authError(error); return msgTo('authMsg', k, 'err', v); }
        $('dlgAuth').close();
      }
    } catch (err) {
      msgTo('authMsg', 'accErr', 'err', { e: err && err.message || String(err) });
    } finally {
      submit.disabled = false;
      if (mode !== 'reset') resetCaptcha();
    }
  }

  async function onForgot() {
    const email = $('auEmail').value.trim();
    if (!validEmail(email)) return msgTo('authMsg', 'accBadEmail', 'err');
    if (capOn && !capToken) return msgTo('authMsg', 'accCaptcha', 'err');
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl(), ...capOpts() });
      if (error) { const [k, v] = authError(error); msgTo('authMsg', k, 'err', v); }
      else msgTo('authMsg', 'accResetSent', 'ok');   // mesma resposta exista a conta ou não
    } catch (err) {
      msgTo('authMsg', 'accErr', 'err', { e: err && err.message || String(err) });
    }
    resetCaptcha();
  }

  /* ---------- editor de perfil ---------- */
  function newPend() { return { avatar: null, banner: null, rmAvatar: false, rmBanner: false }; }
  function dropPend() {
    if (!pend) return;
    ['avatar', 'banner'].forEach(k => { if (pend[k]) URL.revokeObjectURL(pend[k].url); });
    pend = null;
  }

  function openProfile() {
    if (!me) return;
    dropPend(); pend = newPend();
    $('pfName').value = me.display_name;
    $('pfUser').value = me.username;
    $('pfBio').value = me.bio;
    $('pfBioN').textContent = me.bio.length + '/200';
    msgTo('pfMsg', null);
    paintPreview();
    if (!$('dlgProfile').open) $('dlgProfile').showModal();
  }

  function paintPreview() {
    if (!me || !pend) return;
    const aUrl = pend.rmAvatar ? null : pend.avatar ? pend.avatar.url : imgUrl('avatars', me.avatar_path);
    const bUrl = pend.rmBanner ? null : pend.banner ? pend.banner.url : imgUrl('banners', me.banner_path);
    const bi = $('pfBannerImg');
    if (bUrl) { bi.src = bUrl; bi.classList.remove('hidden'); }
    else { bi.removeAttribute('src'); bi.classList.add('hidden'); }
    const holder = $('pfAvatar');
    holder.textContent = '';
    holder.append(avatar(me, 76, aUrl));
  }

  async function sniff(file) {
    const b = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    const at = (i, str) => [...str].every((c, k) => b[i + k] === c.charCodeAt(0));
    if (b[0] === 0x89 && at(1, 'PNG')) return { mime: 'image/png', ext: 'png' };
    if (b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return { mime: 'image/jpeg', ext: 'jpg' };
    if (at(0, 'GIF8')) return { mime: 'image/gif', ext: 'gif' };
    if (at(0, 'RIFF') && at(8, 'WEBP')) return { mime: 'image/webp', ext: 'webp' };
    return null;
  }

  async function pickFile(kind, file) {
    if (!file || !pend) return;
    const bucket = kind === 'avatar' ? 'avatars' : 'banners';
    if (file.size > LIMITS[bucket]) return msgTo('pfMsg', 'pfTooBig', 'err', { mb: LIMITS[bucket] / 1048576 });
    const type = await sniff(file);
    if (!type) return msgTo('pfMsg', 'pfBadType', 'err');
    if (pend[kind]) URL.revokeObjectURL(pend[kind].url);
    pend[kind] = { file, type, url: URL.createObjectURL(file) };
    pend[kind === 'avatar' ? 'rmAvatar' : 'rmBanner'] = false;
    msgTo('pfMsg', null);
    paintPreview();
  }

  function removeImage(kind) {
    if (!pend) return;
    if (pend[kind]) { URL.revokeObjectURL(pend[kind].url); pend[kind] = null; }
    pend[kind === 'avatar' ? 'rmAvatar' : 'rmBanner'] = true;
    paintPreview();
  }

  async function onProfileSave(e) {
    e.preventDefault();
    if (!sb || !session || !me || !pend) return;
    const dn = cleanStr($('pfName').value, 24);
    const un = $('pfUser').value.trim().toLowerCase();
    const bio = $('pfBio').value.replace(/\r/g, '').replace(BIO_CTRL, '').trim().slice(0, 200);
    if (!dn) return msgTo('pfMsg', 'pfNameReq', 'err');
    if (!USER_RE.test(un)) return msgTo('pfMsg', 'accBadUser', 'err');

    const save = $('pfSave');
    save.disabled = true;
    msgTo('pfMsg', 'pfSaving', '');
    const uid = session.user.id;
    const uploaded = [], toDelete = [];
    try {
      let avatar_path = me.avatar_path, banner_path = me.banner_path;
      for (const kind of ['avatar', 'banner']) {
        const bucket = kind === 'avatar' ? 'avatars' : 'banners';
        const cur = kind === 'avatar' ? avatar_path : banner_path;
        let next = cur;
        if (pend[kind]) {
          const f = pend[kind];
          const path = uid + '/' + Date.now() + '-' + rndHex(4) + '.' + f.type.ext;
          const { error } = await sb.storage.from(bucket).upload(path, f.file, { contentType: f.type.mime, cacheControl: '31536000', upsert: false });
          if (error) throw Object.assign(new Error(error.message), { upload: true });
          uploaded.push([bucket, path]);
          next = path;
        } else if (pend[kind === 'avatar' ? 'rmAvatar' : 'rmBanner']) next = null;
        if (next !== cur && cur) toDelete.push([bucket, cur]);
        if (kind === 'avatar') avatar_path = next; else banner_path = next;
      }
      const { error } = await sb.from('profiles')
        .update({ display_name: dn, username: un, bio, avatar_path, banner_path }).eq('id', uid);
      if (error) throw error;
      toDelete.forEach(([b, p]) => bg(sb.storage.from(b).remove([p])));
      await loadMe();
      paint();
      $('dlgProfile').close();
    } catch (err) {
      uploaded.forEach(([b, p]) => bg(sb.storage.from(b).remove([p])));
      if (err && err.code === '23505') msgTo('pfMsg', 'pfUserTaken', 'err');
      else if (err && err.upload) msgTo('pfMsg', 'pfUploadFail', 'err', { e: err.message });
      else msgTo('pfMsg', 'accErr', 'err', { e: (err && err.message) || String(err) });
    } finally {
      save.disabled = false;
    }
  }

  /* ---------- cartão de perfil (clicar em alguém na sala) ---------- */
  function showCard(p) {
    if (!p) return;
    const body = $('cardBody');
    body.textContent = '';
    const ban = el('div', 'pc-banner');
    const bu = imgUrl('banners', p.banner_path);
    if (bu) {
      const i = new Image();
      i.alt = ''; i.decoding = 'async'; i.referrerPolicy = 'no-referrer';
      i.onerror = () => i.remove();
      i.src = bu;
      ban.append(i);
    }
    const info = el('div', 'pc-body');
    info.append(avatar(p, 84), el('h3', '', p.display_name));
    if (p.username) info.append(el('span', 'mut', '@' + p.username));
    const v = el('span', 'vf', '✓ ' + T('cardVerified'));
    info.append(v, el('p', 'pc-bio', p.bio || T('cardNoBio')));
    if (window.Srv) Srv.cardExtras(p, info);
    body.append(ban, info);
    if (!$('dlgCard').open) $('dlgCard').showModal();
  }

  /* ---------- integração com a sala (prova de identidade) ---------- */
  api.avatar = avatar;
  api.sb = () => sb;
  api.imgUrl = imgUrl;
  api.sniff = sniff;
  api.showCard = showCard;
  api.myProfile = () => me;
  api.sigKey = () => me ? me.display_name + '|' + me.avatar_path : '';
  api.newSid = () => { sid = rndHex(16); };
  api.sid = () => (claimedId && claimedId === myId) ? sid : '';
  api.whenClaimed = () => claimP ? Promise.race([claimP, sleep(4000)]) : null;

  api.claim = id => {
    clearInterval(hb);
    claimedId = null; claimP = null;
    if (!sb || !session || !me || !sid) return;
    const run = async () => {
      try {
        const { data, error } = await sb.rpc('claim_peer', { p_peer_id: id, p_sid: sid });
        if (!error) claimedId = data === true ? id : null;
      } catch (e) {}
    };
    claimP = run();
    hb = setInterval(run, 20000);
  };

  api.release = release;
  function release() {
    clearInterval(hb);
    const id = claimedId;
    claimedId = null; claimP = null;
    if (!id || !session) return;
    try {
      fetch(base + '/rest/v1/rpc/release_peer', {
        method: 'POST', keepalive: true,
        headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ p_peer_id: id })
      }).catch(() => {});
    } catch (e) {}
  }

  // Confere no servidor se aquele peer é mesmo da conta que ele diz ser.
  api.verify = async (peerId, rawSid) => {
    const s = cleanStr(rawSid, 64);
    if (!enabled || s.length < 16) return;
    await ready;
    if (!sb) return;
    const p0 = people.get(peerId);
    if (!p0) return;
    p0.sid = s;
    for (const wait of [0, 800, 2500, 6000]) {
      if (wait) await sleep(wait);
      if (people.get(peerId) !== p0) return;
      let row = null;
      try {
        const { data, error } = await sb.rpc('get_peer_profile', { p_peer_id: peerId, p_sid: s });
        if (!error) row = Array.isArray(data) ? data[0] : data;
      } catch (e) {}
      const prof = cleanProfile(row);
      if (prof) {
        p0.prof = prof;
        p0.name = prof.display_name;
        render();
        return;
      }
    }
  };

  api.refreshTexts = () => {
    if (!sb) return;
    buildOauth();
    paint();
    document.querySelectorAll('[data-close]').forEach(b => { b.setAttribute('aria-label', T('accClose')); b.title = T('accClose'); });
  };

  /* ---------- inicialização ---------- */
  async function init() {
    if (!enabled) { resolveReady(); return; }
    $('eyebrowB').dataset.i18n = 'eyebrowB2';
    $('eyebrowB').textContent = T('eyebrowB2');

    $('tabIn').onclick = () => setMode('in');
    $('tabUp').onclick = () => setMode('up');
    $('frmAuth').addEventListener('submit', onAuthSubmit);
    $('authForgot').onclick = onForgot;
    $('frmProfile').addEventListener('submit', onProfileSave);
    $('pfBannerPick').onclick = () => $('fileBanner').click();
    $('pfAvatarPick').onclick = () => $('fileAvatar').click();
    $('pfBannerDel').onclick = () => removeImage('banner');
    $('pfAvatarDel').onclick = () => removeImage('avatar');
    $('fileAvatar').onchange = async e => { await pickFile('avatar', e.target.files[0]); e.target.value = ''; };
    $('fileBanner').onchange = async e => { await pickFile('banner', e.target.files[0]); e.target.value = ''; };
    $('pfBio').addEventListener('input', () => { $('pfBioN').textContent = $('pfBio').value.length + '/200'; });
    $('dlgProfile').addEventListener('close', dropPend);

    const ok = await loadSDK();
    if (!ok) { resolveReady(); return; }
    sb = window.supabase.createClient(base, SB_KEY, {
      auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    // volta do login social: recupera o nome da sala que a pessoa tinha digitado
    try {
      const r = sessionStorage.getItem('sala-pending-room');
      if (r != null) { sessionStorage.removeItem('sala-pending-room'); if (!$('inRoom').value) $('inRoom').value = r.slice(0, 32); }
    } catch (e) {}

    sb.auth.onAuthStateChange((ev, s) => {
      session = s;
      // não chamar o Supabase direto aqui dentro (evita travar o cliente)
      setTimeout(async () => {
        if (ev === 'PASSWORD_RECOVERY') openAuth('reset');
        await loadMe();
        paint();
        resolveReady();
      }, 0);
    });
    setTimeout(resolveReady, 5000);
    buildOauth();
  }

  // botões de fechar (funcionam para qualquer diálogo)
  document.querySelectorAll('[data-close]').forEach(b => { b.onclick = () => $(b.dataset.close).close(); });
  document.querySelectorAll('dialog.dlg').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

  init();
  return api;
})();

applyLang();
</script>
