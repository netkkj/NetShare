<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070b18">
<title>NetShare — Compartilhamento simples e seguro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');

  :root {
    --bg: #070b18;
    --bg-soft: #0b1124;
    --card: rgba(17, 25, 49, .92);
    --card-solid: #111931;
    --surface: rgba(255, 255, 255, .07);
    --surface-hover: rgba(255, 255, 255, .12);
    --fg: #f7f9ff;
    --mut: #9da8c2;
    --line: rgba(255, 255, 255, .12);
    --acc: #6c7cff;
    --acc-2: #8f6cff;
    --cyan: #49d9ff;
    --ok: #43d9a3;
    --bad: #ff667d;
    --warning: #ffd166;
    --shadow: 0 16px 48px rgba(0, 0, 0, .45);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background-color: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Fundo sutil e performático sem background-attachment: fixed no mobile */
  html {
    background:
      radial-gradient(circle at 18% 12%, rgba(108, 124, 255, .14) 0, transparent 35rem),
      radial-gradient(circle at 88% 84%, rgba(73, 217, 255, .09) 0, transparent 32rem),
      var(--bg);
  }

  button, input, select { font: inherit; }
  button {
    min-height: 44px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px;
    padding: 10px 16px;
    background: linear-gradient(135deg, var(--acc), var(--acc-2));
    color: #fff;
    font-weight: 700;
    letter-spacing: -.01em;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(108,124,255,.24);
    transition: transform .15s ease, opacity .15s ease, background .15s ease, border-color .15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    touch-action: manipulation;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:active:not(:disabled) { transform: scale(.97); }
  button.sec { background: var(--surface); box-shadow: none; color: #dce3f7; }
  button.sec:hover:not(:disabled) { background: var(--surface-hover); border-color: rgba(255,255,255,.25); }
  button.bad { background: rgba(255,102,125,.15); border-color: rgba(255,102,125,.3); color: #ff9bad; box-shadow: none; }
  button.bad:hover:not(:disabled) { background: rgba(255,102,125,.25); }
  button.active-btn { background: linear-gradient(135deg, #05c282, #10b981); color: #fff; border-color: rgba(255,255,255,.3); }
  button:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; transform: none !important; }

  input, select {
    width: 100%;
    min-height: 48px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    outline: none;
    background: rgba(5, 9, 22, .75);
    color: var(--fg);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder { color: #66718c; }
  input:focus, select:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(108,124,255,.2); }
  select { cursor: pointer; }
  option { background: #111931; color: var(--fg); }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .hidden { display: none !important; }
  .mut { color: var(--mut); font-size: .84rem; line-height: 1.5; }

  .brand { display: flex; align-items: center; gap: 10px; font: 800 1.15rem/1 'Manrope', sans-serif; letter-spacing: -.03em; }
  .brand-mark { position: relative; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(135deg, var(--acc), var(--cyan)); box-shadow: 0 6px 18px rgba(79,132,255,.34); flex-shrink: 0; }
  .brand-mark svg { width: 19px; height: 19px; }
  .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(67,217,163,.15); }
  .eyebrow { display: flex; align-items: center; gap: 8px; color: #b6c0db; font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }

  /* Top actions (Idioma e Github) */
  #topBar {
    position: absolute;
    top: max(14px, var(--sat));
    right: max(14px, var(--sar));
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 30;
  }
  #gh {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(12,18,37,.85);
    color: #dfe5f6;
    transition: transform .15s, background .15s, color .15s;
  }
  #gh:hover { background: #fff; color: #0b1020; transform: translateY(-1px); }
  #lang {
    width: auto;
    min-width: 140px;
    max-width: 170px;
    min-height: 42px;
    padding: 0 28px 0 12px;
    border-radius: 12px;
    font-size: .84rem;
    border: 1px solid var(--line);
    background: rgba(12,18,37,.85);
    text-overflow: ellipsis;
  }

  /* TELA DE LOGIN / ENTRAR */
  #joinContainer {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(60px + var(--sat)) max(16px, var(--sar)) max(24px, var(--sab)) max(16px, var(--sal));
  }
  #join {
    position: relative;
    width: min(100%, 470px);
    padding: clamp(24px, 5vw, 36px);
    display: grid;
    gap: 15px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: linear-gradient(150deg, rgba(21,31,60,.94), rgba(10,16,35,.92));
    box-shadow: var(--shadow);
    animation: enter .45s ease both;
  }
  #join .brand { margin-bottom: 6px; }
  #join h1 { margin: 2px 0 0; font: 800 clamp(1.6rem, 5vw, 2.3rem)/1.15 'Manrope', sans-serif; letter-spacing: -.04em; }
  #join > p { margin: 0; }
  #join label { display: grid; gap: 6px; color: #c8d0e5; font-size: .84rem; font-weight: 600; }
  #btnJoin { width: 100%; margin-top: 4px; min-height: 50px; font-size: 1rem; }
  #joinErr { margin: 0; color: #ff9bad; font-size: .85rem; font-weight: 700; }
  #joinErr:empty { display: none; }
  .privacy-note { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: rgba(67,217,163,.06); border: 1px solid rgba(67,217,163,.12); }
  .privacy-note svg { flex-shrink: 0; margin-top: 2px; color: var(--ok); }
  .https-warn { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: rgba(255,209,102,.08); border: 1px solid rgba(255,209,102,.2); color: var(--warning); font-size: .82rem; }

  /* TELA DA SALA (ROOM) */
  #room {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: var(--sat) var(--sar) var(--sab) var(--sal);
    position: relative;
  }

  /* Header da Sala */
  #roomHeader {
    flex-shrink: 0;
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    background: rgba(11, 17, 36, .95);
    z-index: 25;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .room-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    font-size: .82rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 170px;
  }
  .header-msg {
    color: var(--warning);
    font-size: .8rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 320px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #btnLink { min-height: 36px; padding: 6px 12px; font-size: .8rem; }
  #btnTogglePeople { min-height: 36px; padding: 6px 12px; font-size: .8rem; position: relative; }

  /* Área Principal da Sala */
  #roomBody {
    flex: 1;
    min-height: 0;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Grid de Vídeo */
  #gridWrapper {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 10px;
    position: relative;
    overflow: hidden;
  }
  #grid {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: grid;
    gap: 10px;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Tiles de Vídeo - Otimizados para GPU móvel */
  .tile {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    border-radius: 16px;
    background: #02040a;
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    transform: translateZ(0); /* Aceleração de hardware */
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .tile video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #02040a;
    display: block;
    transform: translateZ(0);
  }
  .tile-note {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--mut);
    font-size: .88rem;
    text-align: center;
    padding: 16px;
    white-space: pre-line;
    background: rgba(4, 7, 18, .75);
    pointer-events: none;
    z-index: 5;
  }
  .tile-note.interactive { pointer-events: auto; cursor: pointer; }

  /* Controles sobre o Tile */
  .tile-controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px;
    z-index: 10;
    transition: opacity .2s ease;
  }
  .tile:not(.ui) .tile-controls {
    opacity: 0;
  }
  .tile-ctrl-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    pointer-events: auto;
  }
  .tile-ctrl-bot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    pointer-events: auto;
    gap: 8px;
  }
  .tile-label {
    padding: 5px 9px;
    border-radius: 8px;
    background: rgba(7,11,24,.85);
    border: 1px solid rgba(255,255,255,.1);
    color: #fff;
    font-size: .75rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: calc(100% - 110px);
  }
  .tbtn {
    min-height: 34px;
    padding: 4px 9px;
    font-size: .74rem;
    border-radius: 8px;
    background: rgba(7,11,24,.88);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: none;
    color: #fff;
    cursor: pointer;
  }
  .tvol {
    width: 80px;
    min-height: 0;
    padding: 0;
    border: 0;
    background: transparent;
    opacity: .9;
    accent-color: var(--acc);
  }

  /* Estado vazio na sala */
  #empty {
    grid-column: 1/-1;
    grid-row: 1/-1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed rgba(139,151,186,.25);
    border-radius: 18px;
    color: var(--mut);
    background: rgba(255,255,255,.015);
    gap: 12px;
  }
  #empty svg { color: var(--acc); opacity: .7; }

  /* Barra Lateral de Participantes (Gaveta no Mobile) */
  #asidePeople {
    width: 280px;
    flex-shrink: 0;
    background: var(--card-solid);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.2, .9, .2, 1);
    z-index: 20;
  }
  .aside-head {
    padding: 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .aside-head h3 { margin: 0; font: 700 .92rem 'Manrope', sans-serif; }
  .aside-close { min-height: 30px; padding: 4px 8px; font-size: .75rem; display: none; }
  #peopleList {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    list-style: none;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #peopleList li {
    padding: 10px;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 11px;
    background: rgba(4,8,20,.45);
    font-size: .84rem;
  }
  .prow { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .prow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .badge { color: var(--ok); font-size: .72rem; font-weight: 700; white-space: nowrap; }
  .acts { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .acts button { min-height: 28px; padding: 3px 7px; border-radius: 6px; font-size: .7rem; }

  /* Barra de Controles Inferior */
  #controls {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(14, 21, 44, .96);
    border-top: 1px solid var(--line);
    z-index: 25;
    flex-wrap: wrap;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #controls select {
    width: auto;
    min-height: 40px;
    padding: 6px 28px 6px 10px;
    border-radius: 10px;
    font-size: .8rem;
  }
  #controls button {
    min-height: 42px;
    padding: 8px 14px;
    font-size: .84rem;
    border-radius: 11px;
  }
  .sp { flex: 1; }

  /* Modal de Configurações no Mobile */
  #settingsModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    animation: enter .2s ease;
  }
  #settingsContent {
    width: min(100%, 450px);
    background: var(--card-solid);
    border: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    padding: 20px;
    display: grid;
    gap: 14px;
    box-shadow: var(--shadow);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { margin: 0; font-size: 1rem; }

  @keyframes enter {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ========================================================
     OTIMIZAÇÕES RESPONSIVAS E MOBILE
     ======================================================== */
  @media (max-width: 768px) {
    #topBar { top: max(10px, var(--sat)); right: max(10px, var(--sar)); }
    #lang { max-width: 140px; min-width: 110px; font-size: .78rem; min-height: 38px; }
    #gh { width: 38px; height: 38px; }

    #roomHeader {
      padding: 6px 10px;
      min-height: 48px;
    }
    .header-msg { max-width: 140px; font-size: .75rem; }
    .room-tag { max-width: 120px; font-size: .76rem; padding: 4px 8px; }
    #btnLink, #btnTogglePeople { min-height: 34px; padding: 5px 10px; font-size: .74rem; }

    /* Barra de Participantes vira Drawer no mobile */
    #asidePeople {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(85vw, 320px);
      box-shadow: -8px 0 25px rgba(0,0,0,.6);
      transform: translateX(100%);
    }
    #asidePeople.open {
      transform: translateX(0);
    }
    .aside-close { display: inline-flex; }

    /* Barra de controles compacta e amigável ao toque no mobile */
    #controls {
      padding: 8px 8px calc(8px + var(--sab)) 8px;
      gap: 6px;
      justify-content: space-around;
    }
    #controls button {
      flex: 1 1 auto;
      min-height: 42px;
      padding: 6px 10px;
      font-size: .78rem;
    }
    #controls button span.txt { display: inline; }
    .desk-only { display: none !important; }
    .mob-only { display: inline-flex !important; }

    #gridWrapper { padding: 6px; }
    .tile { border-radius: 14px; }
  }

  @media (min-width: 769px) {
    .mob-only { display: none !important; }
  }
</style>
</head>
<body>

<div id="topBar">
  <select id="lang" aria-label="Idioma / Language">
    <option value="pt-BR">Português (BR)</option>
    <option value="en">English</option>
    <option value="pt-PT">Português (PT)</option>
  </select>

  <a id="gh" href="https://github.com/netkkj" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub netkkj">
    <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>
</div>

<!-- ================= TELA DE LOGIN ================= -->
<div id="joinContainer">
  <section id="join">
    <div class="brand" aria-label="NetShare">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2.5" fill="white"/><circle cx="18" cy="6" r="2.5" fill="white"/><circle cx="18" cy="18" r="2.5" fill="white"/><path d="M8.2 10.9 15.7 7M8.2 13.1l7.5 3.9" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></span>
      <span>NetShare</span><span class="brand-dot" aria-hidden="true"></span>
    </div>
    <div class="eyebrow"><span>P2P Direto</span><span>•</span><span>Otimizado para Celular e PC</span></div>
    <h1 data-i18n="title"></h1>
    <p class="mut" data-i18n="joinIntro"></p>

    <div id="httpsNotice" class="https-warn hidden">
      <span>⚠️</span>
      <span data-i18n="httpsWarn"></span>
    </div>

    <label><span data-i18n="lblName"></span> <input id="inName" maxlength="24" data-i18n-ph="phName" autocomplete="off"></label>
    <label><span data-i18n="lblRoom"></span> <input id="inRoom" maxlength="32" data-i18n-ph="phRoom" autocomplete="off"></label>
    <label><span data-i18n="lblPass"></span> <input id="inPass" type="password" maxlength="64" autocomplete="off" data-i18n-ph="phPass"></label>
    <p id="joinErr"></p>
    <button id="btnJoin" data-i18n="btnJoin"></button>
    <p class="mut privacy-note">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 5 6v5c0 4.7 2.9 8.3 7 10 4.1-1.7 7-5.3 7-10V6l-7-3Z" stroke="currentColor" stroke-width="2"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="joinNote"></span>
    </p>
  </section>
</div>

<!-- ================= TELA DA SALA ================= -->
<section id="room" class="hidden">
  <header id="roomHeader">
    <div class="header-left">
      <div class="brand" aria-label="NetShare">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2.5" fill="white"/><circle cx="18" cy="6" r="2.5" fill="white"/><circle cx="18" cy="18" r="2.5" fill="white"/><path d="M8.2 10.9 15.7 7M8.2 13.1l7.5 3.9" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></span>
      </div>
      <div class="room-tag">
        <span data-i18n="roomLbl"></span> <span id="roomName"></span>
      </div>
      <span id="msg" class="header-msg"></span>
    </div>

    <div class="header-right">
      <button id="btnLink" class="sec" title="Copiar link" data-i18n="copyLink"></button>
      <button id="btnTogglePeople" class="sec" title="Participantes">
        👥 <span id="count">1</span>
      </button>
    </div>

  try { const s = localStorage.getItem('sala-lang'); if (s && I18N[s]) return s; } catch (e) {}
  const n = (navigator.language || '').toLowerCase();
  return n.startsWith('pt-pt') ? 'pt-PT' : n.startsWith('pt') ? 'pt-BR' : 'en';
}
let lang = detectLang();
function T(k, v) {
  let s = (I18N[lang] && I18N[lang][k]) || (I18N['pt-BR'][k]) || k;
  if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]);
  return s;
}

let curMsg = { k: null, v: null };
function msg(text) { curMsg = { k: null, v: null }; $('msg').textContent = text || ''; }
function msgK(k, v) { curMsg = { k, v }; $('msg').textContent = T(k, v); }
const msgKey = () => curMsg.k;
let curErr = { k: null, v: null };

  lang = $('lang').value;
  try { localStorage.setItem('sala-lang', lang); } catch (e) {}
  applyLang();
};

/* =========================================================
   CARREGAMENTO SOB DEMANDA DO PEERJS COM FALLBACKS
   ========================================================= */
let peerLoad = null;
function loadPeer() {
  if (window.Peer) return Promise.resolve(true);
  if (peerLoad) return peerLoad;
  peerLoad = new Promise(resolve => {
    const urls = [
      'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
      'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
    ];
    let i = 0;
    const next = () => {
      if (window.Peer) return resolve(true);
      if (i >= urls.length) { peerLoad = null; return resolve(false); }
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = () => (window.Peer ? resolve(true) : next());
      s.onerror = next;
      document.head.appendChild(s);
    };
    next();
  });
  return peerLoad;
}
$('join').addEventListener('focusin', () => loadPeer(), { once: true });
window.addEventListener('load', () => setTimeout(loadPeer, 1200));

/* =========================================================
   REDE WEBRTC E CONFIGURAÇÃO OTIMIZADA
   ========================================================= */
const APP_VERSION = '7.0';
const PEER_OPTS = {
  config: {
    sdpSemantics: 'unified-plan',
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' },
      { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
      { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  }
};

const IS_CHROMIUM = /Chrome\/|Chromium\/|Edg\//.test(navigator.userAgent) && !/CriOS|FxiOS|iPhone|iPad|iPod/.test(navigator.userAgent);

   ========================================================= */
let peer = null;
let myName, baseId, roomKey = null, leaving = false;
let myId = null, mySlot = -1, joinedAt = 0, probeTimer = 0, searchTimer = 0, heirTimer = 0, statusTimer = 0, kickTimer = 0, ownerWindow = 0;
let myStream = null, myKind = null;
let currentFacingMode = 'user'; // 'user' ou 'environment'
const MAX_SLOTS = 12;

const conns = new Map();
const spare = new Map();
const dialing = new Map();
const calls = new Map();
const pendingCalls = new Map();
const people = new Map();
const tiles = new Map();

let own = { id: null, epoch: 0 };
const bans = new Set();
const bansName = new Set();
const hidden = new Set();

const rnd = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now();
const clientId = (() => {
  try {
    let v = localStorage.getItem('sala-cid');
    if (!v) { v = rnd(); localStorage.setItem('sala-cid', v); }
    return v;
  } catch (e) { return rnd(); }
})();

const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'sala';
const slotOf = id => { const m = /_(\d+)$/.exec(id || ''); return m ? +m[1] : 999; };
const norm = s => String(s || '').trim().toLowerCase();
const myAge = () => performance.now() - joinedAt;
const isOwner = () => !!myId && own.id === myId;

/* =========================================================
   ENTRADA E CRIPTOGRAFIA DE SALA
   ========================================================= */
const TE = new TextEncoder();
const toHex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
const rndHex = n => toHex(crypto.getRandomValues(new Uint8Array(n)));

async function deriveRoomKey(room, pass) {
  if (!pass) return null;
  const base = await crypto.subtle.importKey('raw', TE.encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: TE.encode('sala-v7|' + room), iterations: 150000 }, base, 256);
  return crypto.subtle.importKey('raw', bits, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
}
async function makeProof(nonce, id) {
  return toHex(await crypto.subtle.sign('HMAC', roomKey, TE.encode(nonce + '|' + id)));
}

const cleanStr = (s, n) => (typeof s === 'string' ? s : '').replace(/[\u0000-\u001f\u007f-\u009f\u202a-\u202e\u2066-\u2069]/g, '').trim().slice(0, n);
const cleanName = s => cleanStr(s, 24);
const cleanNum = (x, lo, hi) => { x = +x; return isFinite(x) ? Math.min(hi, Math.max(lo, x)) : lo; };
const cleanList = (a, n, len) => Array.isArray(a) ? a.slice(0, n).map(x => cleanStr(x, len)).filter(Boolean) : [];

$('inRoom').value = (() => { try { return decodeURIComponent(location.hash.slice(1) || '').slice(0, 32); } catch (e) { return ''; } })();
['inName', 'inRoom', 'inPass'].forEach(id =>
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('btnJoin').click(); }));

$('btnJoin').onclick = async () => {
  const name = cleanName($('inName').value);
  const room = $('inRoom').value.trim();
  setJoinErr(null);
  if (!name || !room) { setJoinErr('fillFields'); return; }
  $('btnJoin').disabled = true;
  const ok = await loadPeer();
  if (!ok) { $('btnJoin').disabled = false; setJoinErr('libFail'); return; }
  const rs = slug(room);
  const pass = $('inPass').value;
  let key = null;
  try {
    if (pass && !(window.crypto && crypto.subtle)) throw new Error('insecure');
    key = await deriveRoomKey(rs, pass);
  } catch (e) { $('btnJoin').disabled = false; setJoinErr('eSecure'); return; }
  myName = name;
  baseId = 'ss4-' + rs;
  roomKey = key;
  $('btnJoin').disabled = false;
  $('roomName').textContent = room;
  $('joinContainer').classList.add('hidden');
  $('room').classList.remove('hidden');
  start();
};

function destroyTile(t) {
  clearInterval(t.timer);
  try { t.video.srcObject = null; } catch (e) {}
  t.el.remove();
}
function resetState() {
  ignoreUntil.clear(); conns.clear(); spare.clear(); dialing.clear(); calls.clear(); pendingCalls.clear(); people.clear();
  tiles.forEach(destroyTile); tiles.clear();
  own = { id: null, epoch: 0 }; bans.clear(); bansName.clear(); hidden.clear();
  clearTimeout(heirTimer); clearTimeout(kickTimer); kickTimer = 0; ownerWindow = 0;
}
function closeAll() {
  clearInterval(probeTimer); clearTimeout(probeTimer); clearInterval(statusTimer); clearTimeout(searchTimer); clearTimeout(heirTimer); clearTimeout(kickTimer); kickTimer = 0;
  const p = peer; peer = null; myId = null; mySlot = -1;
  try { p && p.destroy(); } catch (e) {}
}

function start() {
  closeAll(); resetState();
  leaving = false;
  joinedAt = performance.now();
  claimSlot(0);
}

function claimSlot(i) {
  if (leaving) return;
  if (i >= MAX_SLOTS) { kickOut('full'); return; }
  let opened = false;
  const me = new Peer(baseId + '_' + i, PEER_OPTS);
  peer = me;

  me.on('open', id => {
    if (me !== peer) return;
    opened = true;
    myId = id; mySlot = i;
    msgK('searching');
    probe();
    setTimeout(probe, 1000);
    setTimeout(probe, 2500);
    const tick = () => {
      probeTimer = setTimeout(() => {
        probe();
        if (isOwner()) broadcast({ t: 'owner', id: own.id, epoch: own.epoch });
        if (me === peer && !leaving) tick();
      }, 7000 + Math.random() * 3000);
    };
    tick();
    updateStatus();
    searchTimer = setTimeout(() => {
      if (!people.size) {
        if (!own.id) claimOwner(false);
        if (msgKey() === 'searching') msgK('created');
      }
    }, 2800);
    render();
  });

  me.on('connection', c => {
    if (me !== peer) return;
    if (!isRoomPeer(c.peer)) { try { c.close(); } catch (e) {} return; }
    setupConn(c, false);
  });
  me.on('call', call => { if (me === peer) onCall(call); });

  me.on('error', e => {
    if (me !== peer) return;
    if (e.type === 'unavailable-id') {
      kill(me);
      if (!opened) claimSlot(i + 1);
      else { msgK('reconnecting'); setTimeout(() => { if (!leaving) start(); }, 300); }
      return;
    }
    if (e.type === 'peer-unavailable') {
      const m = /peer (\S+)$/.exec(String(e.message || ''));
      if (m) { const c = dialing.get(m[1]); dialing.delete(m[1]); if (c) { try { c.close(); } catch (_) {} } }
      return;
    }
    if (!opened && ['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) {
      msgK('serverDown');
      kill(me);
      setTimeout(() => claimSlot(i), 2000);
      return;
    }
    msgK('errConn', { e: e.type });
  });

  me.on('disconnected', () => { if (me === peer && !me.destroyed && !leaving) { try { me.reconnect(); } catch (e) {} } });
  me.on('close', () => { if (me === peer && !me._dead && !leaving) { msgK('reconnecting'); setTimeout(() => { if (!leaving) start(); }, 500); } });
}

function wake() {
  if (leaving || !peer) return;
  try { if (peer.disconnected && !peer.destroyed) peer.reconnect(); } catch (e) {}
  // Garante que vídeos continuem tocando após troca de abas no mobile
  tiles.forEach(t => {
    if (t.video && t.video.paused && !hidden.has(t.id)) {
      t.video.play().catch(() => {});
    }
  });
  setTimeout(probe, 500);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
window.addEventListener('online', wake);

function updateStatus() {
  clearInterval(statusTimer);
  const upd = () => {
    const n = [...connIds()].filter(verifiedConn).length;
    const srv = !peer ? 'srvWait' : (peer.open && !peer.disconnected) ? 'srvOk' : peer.open ? 'srvOff' : 'srvWait';
    const text = T('statusLine', { srv: T(srv), slot: mySlot + 1, n });
    $('statusMobile').textContent = text;
  };
  upd();
  statusTimer = setInterval(upd, 3000);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const ignoreUntil = new Map();
const canDial = id => !!id && !!peer && peer.open && id !== myId && !dialing.has(id)
  && !allConns(id).some(x => x.open && (x.verified || Date.now() - (x.openedAt || 0) < 2000))
  && (ignoreUntil.get(id) || 0) <= Date.now();

let probing = false;
async function probe() {
  if (probing) return;
  probing = true;
  try {
    for (let i = 0; i < MAX_SLOTS; i++) {
      if (leaving || !peer || !peer.open || mySlot < 0) break;
      if (i === mySlot) continue;
      const id = baseId + '_' + i;
      if (!canDial(id)) continue;
      dial(id);
      const t0 = Date.now();
      while (dialing.has(id) && !leaving && Date.now() - t0 < 1200) await sleep(70);
    }
  } finally { probing = false; }
}

function dial(id) {
  if (!canDial(id)) return;
  const c = peer.connect(id, { reliable: true });
  dialing.set(id, c);
  setupConn(c, true);

  // Timeout ajustado para 10s para acomodar handshakes móveis (4G/5G/CGNAT)
  setTimeout(() => {
    if (dialing.get(id) !== c) return;
    dialing.delete(id);
    const pc = c.peerConnection;
    const st = pc ? pc.iceConnectionState : 'new';
    if (st === 'connected' || st === 'completed') return;
    try { c.close(); } catch (e) {}
    if (st === 'new') { ignoreUntil.set(id, Date.now() + 12000); return; }
    ignoreUntil.set(id, Date.now() + 4000);
  }, 10000);
}

/* =========================================================
   CONEXÕES E HANDSHAKE
   ========================================================= */
const MAX_PER_PEER = 3;
const DENIABLE = ['name', 'required', 'open', 'banned', 'wrong'];
const addSpare = (id, c) => { let x = spare.get(id); if (!x) spare.set(id, x = new Set()); x.add(c); };
const allConns = id => { const l = []; const p = conns.get(id); if (p) l.push(p); const x = spare.get(id); if (x) x.forEach(y => { if (y !== p) l.push(y); }); return l; };
const verifiedConn = id => allConns(id).find(x => x.open && x.verified) || null;
const connIds = () => new Set([...conns.keys(), ...spare.keys()]);
const isRoomPeer = id => {
  if (typeof id !== 'string' || !baseId || !id.startsWith(baseId + '_')) return false;
  const r = id.slice(baseId.length + 1);
  return /^\d{1,2}$/.test(r) && +r < MAX_SLOTS;
};
const joinReason = (roomHas, joinerHas) => !joinerHas ? 'required' : !roomHas ? 'open' : 'wrong';

const hasAccepted = () => [...connIds()].some(id => allConns(id).some(x => x.open && x.accepted));
function softKick(reason) {
  if (kickTimer || leaving) return;
  kickTimer = setTimeout(() => { kickTimer = 0; if (!leaving && !hasAccepted()) kickOut(reason); }, 2000);
}

function setupConn(c, outbound) {
  const id = c.peer;
  c.myNonce = rndHex(16);
  c.on('open', () => {
    if (dialing.get(id) === c) dialing.delete(id);
    if (allConns(id).filter(x => x !== c && x.open).length >= MAX_PER_PEER) { try { c.close(); } catch (e) {} return; }
    const cur = conns.get(id);
    if (!cur || cur === c || !cur.open) conns.set(id, c); else addSpare(id, c);
    c.openedAt = Date.now();
    c.vt = setTimeout(() => { if (!c.verified) { try { c.close(); } catch (e) {} } }, 8000);

    const ping = () => { if (c.open && !c.verified) { try { c.send({ t: 'ch', n: c.myNonce }); } catch (e) {} } };
    ping();
    c.rt = [setTimeout(ping, 600), setTimeout(ping, 1800), setTimeout(ping, 3500)];
  });
  c.on('data', d => { c.q = (c.q || Promise.resolve()).then(() => onData(c, d)).catch(e => console.warn(e)); });
  const gone = () => {
    clearTimeout(c.vt); (c.rt || []).forEach(clearTimeout);
    if (dialing.get(id) === c) dialing.delete(id);
    const x = spare.get(id); if (x) { x.delete(c); if (!x.size) spare.delete(id); }
    if (conns.get(id) !== c) return;
    const alt = allConns(id).find(y => y !== c && y.open && y.verified);
    if (alt) { conns.set(id, alt); return; }
    drop(id);
  };
  c.on('close', gone);
  c.on('error', gone);
}

async function sendHello(c) {
  if (!myId || !c.open) return;
  if (c.sentAge == null) c.sentAge = myAge();
  let proof = '';
  try { if (roomKey) proof = await makeProof(c.theirNonce, myId); } catch (e) { return; }
  if (!c.open || leaving) return;
  try {
    c.send({ t: 'hello', name: myName, sharing: !!myStream, kind: myKind, age: c.sentAge, hasPass: !!roomKey, proof,
             slot: mySlot, ver: APP_VERSION, cid: clientId });
  } catch (e) {}
}

async function onData(c, d) {
  const id = c.peer;
  if (!d || typeof d !== 'object' || typeof d.t !== 'string') return;
  if (d.t === 'ch') {
    if (typeof d.n !== 'string' || d.n.length < 8 || d.n.length > 64) return;
    if (!c.theirNonce) c.theirNonce = d.n;
    if (c.theirNonce === d.n) await sendHello(c);
    return;
  }
  if (d.t === 'hello') return onHello(c, d);
  if (d.t === 'denied') { softKick(DENIABLE.includes(d.reason) ? d.reason : 'wrong'); return; }
  if (!c.verified) return;
  if (d.t === 'state') return onState(c, d);
  if (d.t === 'sharing') {
    const p = people.get(id);
    if (p) {
      p.sharing = !!d.on;
      p.kind = d.on && (d.kind === 'cam' || d.kind === 'screen') ? d.kind : null;
      if (!d.on) hidden.delete(id);
      render();
    }
  } else if (d.t === 'owner') {
    mergeOwner({ id: d.id, epoch: d.epoch }, id);
  } else if (d.t === 'ban') {
    if (id === own.id) {
      const cid = cleanStr(d.cid, 64), nm = norm(cleanStr(d.nm, 24));
      if (cid) bans.add(cid);
      if (nm) bansName.add(nm);
      if ((cid && cid === clientId) || (nm && nm === norm(myName))) kickOut('banned');
    }
  } else if (d.t === 'kicked') {
    if (id === own.id) kickOut(d.ban ? 'banned' : 'kicked');
  }
}

async function onHello(c, d) {
  if (c.helloDone) return;
  c.helloDone = true;
  const id = c.peer;
  const refuse = reason => {
    try { c.send({ t: 'denied', reason }); } catch (e) {}
    setTimeout(() => { try { c.close(); } catch (e) {} }, 300);
  };
  const name = cleanName(d.name), cid = cleanStr(d.cid, 64);
  if (!name || !cid) { try { c.close(); } catch (e) {} return; }
  if (bans.has(cid) || bansName.has(norm(name))) return refuse('banned');

  const theirHas = !!d.hasPass, myHas = !!roomKey;
  let authOk = theirHas === myHas;
  if (authOk && myHas) {
    try { authOk = typeof d.proof === 'string' && (await makeProof(c.myNonce, id)) === d.proof; } catch (e) { authOk = false; }
  }
  if (leaving || !c.open) return;

  const mine = c.sentAge != null ? c.sentAge : myAge();
  const theirs = cleanNum(d.age, 0, 1e12);
  const theyAreOlder = theirs > mine || (theirs === mine && slotOf(id) < mySlot);
  if (!authOk) {
    if (theyAreOlder) softKick(joinReason(theirHas, myHas));
    else refuse(joinReason(myHas, theirHas));
    return;
  }
  if (norm(name) === norm(myName)) {
    if (theyAreOlder) kickOut('name'); else refuse('name');
    return;
  }

  c.verified = true; c.theyOlder = theyAreOlder;
  clearTimeout(c.vt);
  if (!people.has(id)) {
    people.set(id, { name, sharing: !!d.sharing, kind: d.sharing && (d.kind === 'cam' || d.kind === 'screen') ? d.kind : null,
                     cid, slot: cleanNum(d.slot, 0, MAX_SLOTS), since: performance.now() - theirs });
  }
  const cur = conns.get(id);
  if (cur !== c && !(cur && cur.open && cur.verified)) {
    if (cur) addSpare(id, cur);
    const x = spare.get(id); if (x) x.delete(c);
    conns.set(id, c);
  }
  sendState(c);
  if (['searching', 'created'].includes(msgKey())) msg('');
  const pc = pendingCalls.get(id);
  if (pc) { pendingCalls.delete(id); answerCall(pc); }
  if (myStream) callPeer(id);
  render();
}

function sendState(c) {
  try { c.send({ t: 'state', own: { id: own.id, epoch: own.epoch }, bans: [...bans].slice(0, 200), bn: [...bansName].slice(0, 200) }); } catch (e) {}
}
function onState(c, d) {
  c.accepted = true;
  const o = d.own;
  if (o && typeof o.id === 'string') mergeOwner({ id: o.id, epoch: o.epoch }, 'hello');
  if (c.peer === own.id) {
    const b = cleanList(d.bans, 200, 64), n = cleanList(d.bn, 200, 24).map(norm);
    if (b.includes(clientId) || n.includes(norm(myName))) { kickOut('banned'); return; }
    b.forEach(x => bans.add(x)); n.forEach(x => bansName.add(x));
  }
  if (!own.id && c.theyOlder === false) claimOwner(false);
}

function kickOut(reason) {
  const map = { name:'eName', required:'eRequired', open:'eOpen', full:'eFull', banned:'eBanned', kicked:'eKicked', wrong:'eWrong' };
  leaveRoom();
  setJoinErr(map[reason] || 'eWrong', { n: MAX_SLOTS });
}

function broadcast(m) { connIds().forEach(id => { const c = verifiedConn(id); if (c) { try { c.send(m); } catch (e) {} } }); }
function drop(id) {
  conns.delete(id); people.delete(id); pendingCalls.delete(id); hidden.delete(id);
  const c = calls.get(id); if (c) c.close(); calls.delete(id);
  removeTile(id);
  if (own.id === id) ownerLeft();
  render();
}

/* =========================================================
   CONTROLE DO DONO DA SALA
   ========================================================= */
function mergeOwner(o, sender) {
  if (!o || typeof o.id !== 'string' || o.id.length > 80 || !Number.isSafeInteger(o.epoch) || o.epoch < 0 || o.epoch > 1e6) return;
  if (o.id !== myId && !people.has(o.id)) return;
  if (sender !== 'hello') {
    if (sender !== o.id && sender !== own.id) return;
    const viaOwner = sender === own.id;
    const contest = o.epoch === own.epoch && performance.now() < ownerWindow;
    if (!viaOwner && own.id && !contest) return;
    if (!viaOwner && o.epoch > own.epoch + 1) return;
  }
  let take = false;
  if (o.epoch > own.epoch) take = true;
  else if (o.epoch === own.epoch && o.id !== own.id) take = !own.id || slotOf(o.id) < slotOf(own.id);
  if (!take) return;
  const prev = own.id;
  own = { id: o.id, epoch: o.epoch };
  ownerChanged(prev, true);
}
function ownerChanged(prev, announce) {
  clearTimeout(heirTimer);
  if (announce && prev !== own.id) {
    if (own.id === myId) msgK('youOwner');
    else if (people.get(own.id) && prev) msgK('newOwner', { name: people.get(own.id).name });
    setTimeout(() => { if (['youOwner', 'newOwner'].includes(msgKey())) msg(''); }, 4000);
  }
  render();
}
function claimOwner(announce) {
  if (!myId) return;
  const prev = own.id;
  own = { id: myId, epoch: own.epoch + 1 };
  broadcast({ t: 'owner', id: own.id, epoch: own.epoch });
  ownerChanged(prev, announce);
}
function ownerLeft() {
  own = { id: null, epoch: own.epoch };
  ownerWindow = performance.now() + 5000;
  clearTimeout(heirTimer);
  if (!myId) return;
  const cands = [{ id: myId, since: joinedAt, slot: mySlot }];
  people.forEach((p, id) => cands.push({ id, since: p.since, slot: p.slot != null ? p.slot : slotOf(id) }));
  cands.sort((a, b) => a.since - b.since || a.slot - b.slot);
  if (cands[0].id === myId) { claimOwner(true); return; }
  heirTimer = setTimeout(() => {
    if (own.id || leaving || !peer) return;
    const lowest = [...cands].filter(c => c.id === myId || people.has(c.id)).sort((a, b) => a.slot - b.slot)[0];
    if (lowest && lowest.id === myId) claimOwner(true);
  }, 1500);
}
function transferOwner(id) {
  if (!isOwner()) return;
  const p = people.get(id); if (!p) return;
  if (!confirm(T('confirmOwner', { name: p.name }))) return;
  own = { id, epoch: own.epoch + 1 };
  broadcast({ t: 'owner', id: own.id, epoch: own.epoch });
  ownerChanged(myId, false);
}
function kickPerson(id, ban) {
  if (!isOwner()) return;
  const p = people.get(id), c = verifiedConn(id); if (!p || !c) return;
  if (!confirm(T(ban ? 'confirmBan' : 'confirmKick', { name: p.name }))) return;
  if (ban) {
    bans.add(p.cid); bansName.add(norm(p.name));
    broadcast({ t: 'ban', cid: p.cid, nm: norm(p.name) });
  }
  try { c.send({ t: 'kicked', ban: !!ban }); } catch (e) {}
  setTimeout(() => { allConns(id).forEach(x => { try { x.close(); } catch (e) {} }); }, 300);
}

/* =========================================================
   RECEBER VÍDEO
   ========================================================= */
function onCall(call) {
  if (!isRoomPeer(call.peer)) { try { call.close(); } catch (e) {} return; }
  if (verifiedConn(call.peer)) { answerCall(call); return; }
  pendingCalls.set(call.peer, call);
  setTimeout(() => {
    if (pendingCalls.get(call.peer) === call) { pendingCalls.delete(call.peer); try { call.close(); } catch (e) {} }
  }, 8000);
}
function answerCall(call) {
  call.answer(undefined, { sdpTransform: tuneSdp });
  call.on('stream', s => showTile(call.peer, s, call));
  call.on('close', () => { const t = tiles.get(call.peer); if (t && t.call === call) removeTile(call.peer); });
}

/* =========================================================
   QUALIDADE E TAXA DE BITS (OTIMIZADA PARA CELULAR E REDE MÓVEL)
   ========================================================= */
const DIMS = { 720: [1280, 720], 1080: [1920, 1080] };
function qualitySettings() {
  const fps = +(isMobile ? $('fpsMob').value : $('fps').value);
  const res = +(isMobile ? $('resMob').value : $('res').value);
  const [w, h] = DIMS[res] || DIMS[720];

  // Bitrates realistas para não sobrecarregar processador e 4G móvel
  // Mobile: max 2.5 Mbps para 720p / 4 Mbps para 1080p
  // PC: max 5 Mbps para 720p / 8 Mbps para 1080p
  const maxBps = isMobile
    ? (res === 720 ? 2500000 : 4000000)
    : (res === 720 ? 4500000 : 8000000);

  return { fps, res, w, h, base: maxBps };
}

function tuneSdp(sdp) {
  if (!IS_CHROMIUM) return sdp;
  try {
    const lines = sdp.split('\r\n');
    const pts = new Set(), withFmtp = new Set();
    lines.forEach(l => {
      let m = l.match(/^a=rtpmap:(\d+) (VP8|VP9|H264|AV1)\//);
      if (m) pts.add(m[1]);
      m = l.match(/^a=fmtp:(\d+) /);
      if (m) withFmtp.add(m[1]);
    });
    // Limite saudável de bitrate no SDP para evitar congelamento no mobile
    const maxKbps = isMobile ? '3500' : '8000';
    const extra = `x-google-start-bitrate=1200;x-google-min-bitrate=400;x-google-max-bitrate=${maxKbps}`;
    const out = [];
    lines.forEach(l => {
      let m = l.match(/^a=fmtp:(\d+) (.*)$/);
      if (m && pts.has(m[1]) && !l.includes('x-google-')) { out.push(l + ';' + extra); return; }
      out.push(l);
      m = l.match(/^a=rtpmap:(\d+) /);
      if (m && pts.has(m[1]) && !withFmtp.has(m[1])) out.push('a=fmtp:' + m[1] + ' ' + extra);
    });
    return out.join('\r\n');
  } catch (e) { return sdp; }
}

function applyQuality() {
  if (!myStream) return;
  const q = qualitySettings();
  const n = Math.max(1, calls.size);
  const per = Math.round(Math.max(600000, Math.min(q.base, (q.base * 1.4) / n)));

  calls.forEach(c => {
    const pc = c.peerConnection; if (!pc) return;
    pc.getSenders().forEach(s => {
      if (!s.track || s.track.kind !== 'video') return;
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      const e = p.encodings[0];
      e.maxBitrate = per;
      e.maxFramerate = q.fps;
      p.degradationPreference = (myKind === 'screen') ? 'maintain-resolution' : 'maintain-framerate';
      s.setParameters(p).catch(() => {});
    });
  });
}

let qTimers = [];
function scheduleQuality() {
  qTimers.forEach(clearTimeout);
  qTimers = [setTimeout(applyQuality, 800), setTimeout(applyQuality, 2500)];
}

/* =========================================================
   TRANSMISSÃO DE TELA E CÂMERA (RESILIENTE PARA CELULAR)
   ========================================================= */
const canShareScreen = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
const canUseCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

let hasAudio = false;
function audioKey() { return hasAudio ? 'audOn' : 'audNone'; }

function updateLocalNote() {
  const t = tiles.get('me');
  if (!t || !myStream) return;
  if (t.note) {
    const vt = myStream.getVideoTracks()[0]; if (!vt) return;
    const s = vt.getSettings ? vt.getSettings() : {};
    const info = (s.width || '?') + '×' + (s.height || '?') + ' · ' + Math.round(s.frameRate || 0) + ' FPS · ' + T(audioKey());
    const head = calls.size === 0 ? T('sharingReady') : calls.size === 1 ? T('sharing1') : T('sharingN', { n: calls.size });
    t.note.textContent = head + '\n' + info;
  }
}

function callPeer(id) {
  if (!myStream || !peer || calls.has(id)) return;
  const c = peer.call(id, myStream, { sdpTransform: tuneSdp });
  calls.set(id, c);
  c.on('close', () => {
    if (calls.get(id) === c) { calls.delete(id); updateLocalNote(); scheduleQuality(); }
  });
  updateLocalNote();
  scheduleQuality();
}

// CAPTURA DE TELA TOTALMENTE RESILIENTE PARA CELULARES E PCS
async function getScreenStream(q) {
  if (!canShareScreen) throw new Error(T('cantScreen'));

  // No celular (Android/iOS): getDisplayMedia NÃO aceita áudio de sistema
  // Se passar parâmetros de áudio no celular, ele lança NotSupportedError ou OverconstrainedError imediatamente!
  if (isMobile) {
    try {
      return await navigator.mediaDevices.getDisplayMedia({
        video: {
          frameRate: { ideal: Math.min(q.fps, 30), max: 30 },
          width: { ideal: Math.min(q.w, 1280) }
        }
      });
    } catch (err) {
      // Fallback mínimo universal para celular
      return await navigator.mediaDevices.getDisplayMedia({ video: true });
    }
  }

  // Desktop (PC): tenta com áudio do sistema primeiro
  try {
    return await navigator.mediaDevices.getDisplayMedia({
      video: { cursor: 'always', frameRate: { ideal: q.fps, max: q.fps }, width: { ideal: q.w }, height: { ideal: q.h } },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      systemAudio: 'include'
    });
  } catch (e1) {
    try {
      return await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: { ideal: q.fps, max: q.fps }, width: { ideal: q.w }, height: { ideal: q.h } },
        audio: true
      });
    } catch (e2) {
      // Fallback sem áudio
      return await navigator.mediaDevices.getDisplayMedia({ video: true });
    }
  }
}

// CAPTURA DE CÂMERA COM CANCELAMENTO DE ECO E FLIP
async function getCameraStream(q, facing) {
  if (!canUseCamera) throw new Error(T('cantCam'));

  const videoConstraints = {
    facingMode: { ideal: facing },
    frameRate: { ideal: q.fps, max: q.fps },
    width: { ideal: q.w },
    height: { ideal: q.h }
  };

  const audioConstraints = {
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl: true
  };

  try {
    return await navigator.mediaDevices.getUserMedia({
      video: videoConstraints,
      audio: audioConstraints
    });
  } catch (err) {
    // Tenta sem áudio se o microfone for negado
    return await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
  }
}

async function share(kind) {
  if (kind === 'screen' && !canShareScreen) { msgK('cantScreen'); return; }
  if (kind === 'cam' && !canUseCamera) { msgK('cantCam'); return; }
  if (myStream) stopShare();

  const q = qualitySettings();
  let stream;
  try {
    if (kind === 'screen') {
      stream = await getScreenStream(q);
    } else {
      stream = await getCameraStream(q, currentFacingMode);
    }
  } catch (e) {
    if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') {
      msgK('startFail', { e: e.message || e.name });
    }
    return;
  }

  myStream = stream;
  myKind = kind;
  hasAudio = stream.getAudioTracks().length > 0;

  if (kind === 'screen' && !hasAudio && isMobile) {
    msgK('noSysAudio');
    setTimeout(() => { if (msgKey() === 'noSysAudio') msg(''); }, 5000);
  } else {
    msg('');
  }

  const vt = stream.getVideoTracks()[0];
  if (vt) {
    vt.contentHint = (kind === 'screen') ? 'detail' : 'motion';
    vt.onended = () => stopShare();
  }

  showTile('me', myStream, null, true);
  connIds().forEach(id => { if (verifiedConn(id)) callPeer(id); });
  broadcast({ t: 'sharing', on: true, kind });
  updateLocalNote();
  updateButtons();
  render();
}

// Inverter Câmera (Frontal / Traseira)
async function flipCamera() {
  if (myKind !== 'cam') return;
  currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
  const q = qualitySettings();
  try {
    const newStream = await getCameraStream(q, currentFacingMode);
    const newVt = newStream.getVideoTracks()[0];
    const oldVt = myStream ? myStream.getVideoTracks()[0] : null;

    if (oldVt) {
      oldVt.stop();
      myStream.removeTrack(oldVt);
    }
    myStream.addTrack(newVt);
    newVt.onended = () => stopShare();

    // Atualiza remetentes WebRTC sem derrubar chamada
    calls.forEach(c => {
      const pc = c.peerConnection;
      if (!pc) return;
      pc.getSenders().forEach(s => {
        if (s.track && s.track.kind === 'video') {
          s.replaceTrack(newVt).catch(() => {});
        }
      });
    });

    const t = tiles.get('me');
    if (t && t.video) t.video.srcObject = myStream;
  } catch (e) {
    share('cam');
  }
}

function stopShare() {
  if (!myStream) return;
  const s = myStream;
  myStream = null;
  myKind = null;
  s.getTracks().forEach(t => { t.onended = null; t.stop(); });
  hasAudio = false;
  const list = [...calls.values()];
  calls.clear();
  list.forEach(c => c.close());
  removeTile('me');
  broadcast({ t: 'sharing', on: false });
  updateButtons();
  render();
}

async function qualityChanged() {
  if (!myStream) return;
  const q = qualitySettings();
  const vt = myStream.getVideoTracks()[0];
  if (vt && vt.applyConstraints) {
    try {
      await vt.applyConstraints({
        frameRate: { ideal: q.fps, max: q.fps },
        width: { ideal: q.w },
        height: { ideal: q.h }
      });
    } catch (e) {}
  }
  applyQuality();
  setTimeout(updateLocalNote, 500);
}

$('fps').onchange = () => { $('fpsMob').value = $('fps').value; qualityChanged(); };
$('res').onchange = () => { $('resMob').value = $('res').value; qualityChanged(); };
$('fpsMob').onchange = () => { $('fps').value = $('fpsMob').value; qualityChanged(); };
$('resMob').onchange = () => { $('res').value = $('resMob').value; qualityChanged(); };

$('btnLink').onclick = async () => {
  const link = location.href.split('#')[0] + '#' + encodeURIComponent($('roomName').textContent);
  try { await navigator.clipboard.writeText(link); msgK('linkCopied'); }
  catch (e) { prompt(T('copyPrompt'), link); }
  setTimeout(() => { if (msgKey() === 'linkCopied') msg(''); }, 2500);
};

$('btnScreen').onclick = () => share('screen');
$('btnCam').onclick = () => share('cam');
$('btnFlipCam').onclick = flipCamera;
$('btnStop').onclick = stopShare;

function leaveRoom() {
  stopShare();
  leaving = true;
  closeAll();
  resetState();
  msg('');
  $('room').classList.add('hidden');
  $('joinContainer').classList.remove('hidden');
}
$('btnLeave').onclick = leaveRoom;
window.addEventListener('beforeunload', () => { leaving = true; closeAll(); });

function updateButtons() {
  $('btnStop').disabled = !myStream;
  const screenTxt = $('btnScreen').querySelector('.txt');
  if (screenTxt) {
    screenTxt.textContent = !canShareScreen ? T('btnScreenNA') : myKind === 'screen' ? T('btnScreenRe') : T('btnScreen');
  }
  $('btnScreen').classList.toggle('active-btn', myKind === 'screen');

  const camTxt = $('btnCam').querySelector('.txt');
  if (camTxt) {
    camTxt.textContent = myKind === 'cam' ? T('btnCamRe') : T('btnCam');
  }
  $('btnCam').classList.toggle('active-btn', myKind === 'cam');

  // Mostra botão de inverter câmera apenas quando a câmera estiver ativa
  $('btnFlipCam').classList.toggle('hidden', myKind !== 'cam');
}

/* =========================================================
   INTERFACE, ÁUDIO E EXIBIÇÃO DE VÍDEOS
   ========================================================= */
let masterVol = (() => {
  try {
    const v = parseFloat(localStorage.getItem('sala-vol'));
    return isNaN(v) ? 1 : Math.min(1, Math.max(0, v));
  } catch (e) { return 1; }
})();

function applyVolume(t) {
  try {
    if (t.video) {
      t.video.volume = Math.min(1, Math.max(0, masterVol * (t.vol == null ? 1 : t.vol)));
    }
  } catch (e) {}
}

const updateMasterVol = (val) => {
  masterVol = val / 100;
  $('vol').value = val;
  $('volMob').value = val;
  try { localStorage.setItem('sala-vol', String(masterVol)); } catch (e) {}
  tiles.forEach(t => { if (!t.local) applyVolume(t); });
};
$('vol').oninput = () => updateMasterVol($('vol').value);
$('volMob').oninput = () => updateMasterVol($('volMob').value);
$('vol').value = Math.round(masterVol * 100);
$('volMob').value = Math.round(masterVol * 100);

// Gaveta de Participantes
$('btnTogglePeople').onclick = () => $('asidePeople').classList.toggle('open');
$('btnClosePeople').onclick = () => $('asidePeople').classList.remove('open');

// Modal de Configurações Mobile
$('btnSettings').onclick = () => $('settingsModal').classList.remove('hidden');
$('btnCloseSettings').onclick = () => $('settingsModal').classList.add('hidden');
$('settingsModal').onclick = e => { if (e.target === $('settingsModal')) $('settingsModal').classList.add('hidden'); };

function updateSoundBtn(t) {
  if (!t.snd) return;
  t.snd.textContent = t.video.muted ? '🔇' : '🔊';
  t.snd.title = t.video.muted ? T('soundOn') : T('soundOff');
}
function updateTileTexts(t) {
  if (t.hbtn) t.hbtn.title = T('hideScreen');
  if (t.vslider) t.vslider.title = T('volTile');
  updateSoundBtn(t);
}

// Reprodução remota à prova de bloqueio de autoplay no mobile
function startRemotePlayback(t) {
  const v = t.video;
  v.muted = false;
  const p = v.play();
  if (p && p.catch) {
    p.catch(() => {
      // Bloqueado pelo navegador móvel: reproduz mudo e mostra aviso para tocar
      v.muted = true;
      v.play().catch(() => {});
      if (t.note) {
        t.note.textContent = T('tapToPlay');
        t.note.classList.add('interactive');
        t.note.classList.remove('hidden');
      }
    });
  }
}

function showTile(id, stream, call, isLocal) {
  let t = tiles.get(id);
  if (!t) {
    const el = document.createElement('div');
    el.className = 'tile';

    const video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    video.setAttribute('playsinline', 'true');
    video.setAttribute('webkit-playsinline', 'true');

    const note = document.createElement('div');
    note.className = 'tile-note hidden';

    const ctrl = document.createElement('div');
    ctrl.className = 'tile-controls';

    const ctrlTop = document.createElement('div');
    ctrlTop.className = 'tile-ctrl-top';

    const label = document.createElement('div');
    label.className = 'tile-label';

    const ctrlBot = document.createElement('div');
    ctrlBot.className = 'tile-ctrl-bot';

    el.append(video);
    el.append(note);
    el.append(ctrl);
    ctrl.append(ctrlTop);
    ctrl.append(ctrlBot);
    ctrlBot.append(label);

    t = {
      id, el, video, label, note, ctrl,
      call: null, stream: null, snd: null, hbtn: null, fbtn: null,
      noPreview: false, timer: 0, fps: 0, res: '', lastFrames: 0, lastT: 0,
      created: performance.now(), userMuted: false, local: !!isLocal, vol: 1, vslider: null
    };

    if (isLocal && myKind === 'screen') {
      t.noPreview = true;
      note.classList.remove('hidden');
    }

    if (!isLocal) {
      // Botão Mudo/Áudio
      t.snd = document.createElement('button');
      t.snd.className = 'tbtn';
      t.snd.textContent = '🔊';
      t.snd.onclick = e => {
        e.stopPropagation();
        t.video.muted = !t.video.muted;
        t.userMuted = t.video.muted;
        if (!t.video.muted) t.video.play().catch(() => {});
        updateSoundBtn(t);
      };
      ctrlTop.append(t.snd);

      // Botão Ocultar
      t.hbtn = document.createElement('button');
      t.hbtn.className = 'tbtn';
      t.hbtn.textContent = '🙈';
      t.hbtn.onclick = e => { e.stopPropagation(); toggleHide(id); };
      ctrlTop.append(t.hbtn);

      // Botão Tela Cheia no Tile
      t.fbtn = document.createElement('button');
      t.fbtn.className = 'tbtn';
      t.fbtn.textContent = '⛶';
      t.fbtn.title = 'Tela cheia';
      t.fbtn.onclick = e => {
        e.stopPropagation();
        if (document.fullscreenElement) document.exitFullscreen();
        else el.requestFullscreen().catch(() => { if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); });
      };
      ctrlTop.append(t.fbtn);

      // Volume individual
      t.vslider = document.createElement('input');
      t.vslider.type = 'range';
      t.vslider.className = 'tvol';
      t.vslider.min = 0; t.vslider.max = 100; t.vslider.value = 100;
      t.vslider.oninput = () => { t.vol = t.vslider.value / 100; applyVolume(t); };
      t.vslider.onclick = e => e.stopPropagation();
      ctrlBot.append(t.vslider);

      // Toque para desmutar ou reproduzir
      el.onclick = () => {
        if (t.video.paused) t.video.play().catch(() => {});
        if (t.video.muted && !t.userMuted) {
          t.video.muted = false;
          updateSoundBtn(t);
        }
        note.classList.add('hidden');
      };

      applyVolume(t);
    }

    // Controle de toque no mobile para mostrar/ocultar barra de controle do tile
    {
      let tmr = 0;
      const showUi = () => {
        el.classList.add('ui');
        clearTimeout(tmr);
        tmr = setTimeout(() => el.classList.remove('ui'), 3500);
      };
      el.addEventListener('pointerdown', showUi);
      el.addEventListener('pointermove', showUi);
    }

    if (hidden.has(id)) el.classList.add('hidden');
    $('grid').append(el);
    tiles.set(id, t);
    updateTileTexts(t);

    if (!isLocal) {
      t.lastT = performance.now();
      t.timer = setInterval(() => {
        if (document.hidden) return;
        const v = t.video;
        const q = v.getVideoPlaybackQuality && v.getVideoPlaybackQuality();
        const now = performance.now();
        if (q) {
          t.fps = Math.round((q.totalVideoFrames - t.lastFrames) * 1000 / (now - t.lastT));
          t.lastFrames = q.totalVideoFrames;
        }
        t.lastT = now;
        t.res = v.videoWidth ? v.videoWidth + '×' + v.videoHeight : '';
        if (t.note && !t.note.classList.contains('interactive')) {
          const stuck = !v.videoWidth || v.paused;
          const waited = now - t.created > 3500;
          t.note.textContent = T('loadingImg');
          t.note.classList.toggle('hidden', !(stuck && waited));
        }
      }, 3000);
    }
  }

  t.stream = stream;
  if (!t.noPreview && t.video.srcObject !== stream) {
    t.video.srcObject = stream;
    if (isLocal) {
      t.video.muted = true;
      t.video.play().catch(() => {});
    } else {
      if (t.userMuted) {
        t.video.muted = true;
        t.video.play().catch(() => {});
      } else {
        startRemotePlayback(t);
      }
    }
  }
  t.call = call;
  render();
}

function removeTile(id) {
  const t = tiles.get(id);
  if (t) { destroyTile(t); tiles.delete(id); }
  render();
}

function toggleHide(id) {
  if (hidden.has(id)) hidden.delete(id); else hidden.add(id);
  const t = tiles.get(id);
  if (t) t.el.classList.toggle('hidden', hidden.has(id));
  render();
}

let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; doRender(); });
}
window.addEventListener('resize', render);

let lastSig = '';
function renderPeople() {
  const total = people.size + 1;
  $('count').textContent = total;
  $('count2').textContent = total;

  const list = [...people].map(([id, p]) => [id, p.name, p.sharing ? 1 : 0, p.kind || '']);
  const sig = JSON.stringify([lang, own.id, myId, myName, !!myStream, myKind, [...hidden], list, isOwner()]);
  if (sig === lastSig) return;
  lastSig = sig;

  const ul = $('peopleList'); ul.textContent = '';
  const mkBtn = (txt, cls, fn) => { const b = document.createElement('button'); b.textContent = txt; if (cls) b.className = cls; b.onclick = fn; return b; };
  const row = (id, name, sharing, kind, you) => {
    const li = document.createElement('li');
    const top = document.createElement('div'); top.className = 'prow';
    const n = document.createElement('span'); n.className = 'nm';
    const crown = id && own.id === id;
    n.textContent = (crown ? '👑 ' : '') + name + (you ? ' (' + T('you') + ')' : '');
    top.append(n);
    if (sharing) {
      const b = document.createElement('span'); b.className = 'badge';
      b.textContent = kind === 'cam' ? T('badgeCam') : T('badgeScreen');
      top.append(b);
    }
    li.append(top);
    if (!you) {
      const acts = document.createElement('div'); acts.className = 'acts';
      if (sharing) acts.append(mkBtn(hidden.has(id) ? T('showScreen') : T('hideScreen'), 'sec', () => toggleHide(id)));
      if (isOwner()) {
        acts.append(mkBtn(T('kick'), 'sec', () => kickPerson(id, false)));
        acts.append(mkBtn(T('ban'), 'bad', () => kickPerson(id, true)));
        acts.append(mkBtn(T('makeOwner'), 'sec', () => transferOwner(id)));
      }
      if (acts.children.length) li.append(acts);
    }
    ul.append(li);
  };
  row(myId, myName || '', !!myStream, myKind, true);
  people.forEach((p, id) => row(id, p.name, p.sharing, p.kind, false));
}

function doRender() {
  renderPeople();

  tiles.forEach((t, id) => {
    const me = id === 'me';
    const name = me ? myName + ' (' + T('you') + ')' : (people.get(id) || {}).name || '...';
    const kind = me ? myKind : (people.get(id) || {}).kind;
    let text = name + ' — ' + (kind === 'cam' ? T('tagCam') : T('tagScreen'));
    if (me) {
      text += ' · ' + T(audioKey());
    } else {
      if (t.res) text += ' · ' + t.res;
      if (t.fps) text += ' · ' + t.fps + 'fps';
    }
    if (t.label.textContent !== text) t.label.textContent = text;
  });

  const visibleTiles = [...tiles.keys()].filter(id => !hidden.has(id)).length;
  $('empty').classList.toggle('hidden', visibleTiles > 0);
  $('emptyTxt').textContent = tiles.size > 0 ? T('emptyHidden') : T('emptyNone');

  // Ajuste inteligente do Grid para Mobile e Desktop
  const grid = $('grid');
  if (visibleTiles === 0) {
    grid.style.gridTemplateColumns = '1fr';
    grid.style.gridTemplateRows = '1fr';
  } else if (visibleTiles === 1) {
    grid.style.gridTemplateColumns = '1fr';
    grid.style.gridTemplateRows = '1fr';
  } else if (visibleTiles === 2) {
    if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
      // Mobile em modo retrato: empilhado
      grid.style.gridTemplateColumns = '1fr';
      grid.style.gridTemplateRows = 'repeat(2, minmax(0, 1fr))';
    } else {
      grid.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';
      grid.style.gridTemplateRows = '1fr';
    }
  } else {
    const cols = (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) ? 1 : Math.ceil(Math.sqrt(visibleTiles));
    const rows = Math.ceil(visibleTiles / cols);
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
  }
}

applyLang();
</script>
