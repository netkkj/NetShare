/* junta mensagens seguidas da mesma pessoa; quebra se outra pessoa falou ou se passaram 5 min */
const GROUP_MS = 5 * 60 * 1000;
function regroup() {
  let prev = null;
  $('svMsgs').querySelectorAll('.msg').forEach(m => {
    const ts = +m.dataset.ts || 0;
    const cont = !!prev && !!m.dataset.uid && prev.dataset.uid === m.dataset.uid && ts - (+prev.dataset.ts || 0) >= 0 && ts - (+prev.dataset.ts || 0) < GROUP_MS;
    m.classList.toggle('cont', cont);
    prev = m;
  });
}
function startEdit(d, r) {
  const mt = d.querySelector('.mt'); if (!mt || mt.querySelector('textarea')) return;
  const ta = el('textarea', 'medit'); ta.maxLength = 1000; ta.value = r.content || '';
  ta.rows = Math.min(8, (ta.value.match(/\n/g) || []).length + 2);
  mt.textContent = ''; mt.classList.remove('jumbo'); mt.append(ta, el('div', 'mut', t('editHint')));
  const cancel = () => paintText(mt, r);
  const save = async () => {
    const c = ta.value.replace(/\r/g, '').replace(CTRL, '').trim().slice(0, 1000);
    if (!c) return;                          // para esvaziar, use o botão de apagar
    if (c === r.content) return cancel();
    if (EVERY_RE.test(c) && !EVERY_RE.test(r.content || '')) { await loadEveryone(); if (!canEveryone()) return err(everyoneMsg()); }
    ta.disabled = true;
    const { data, error } = await sb().rpc('ns_edit_message', { p_id: r.id, p_content: c });
    if (error) { ta.disabled = false; err(error); ta.focus(); return; }
    r.content = c; r.edited_at = data || new Date().toISOString(); paintText(mt, r);
  };
  ta.onkeydown = e => {
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
  };
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
function updateMsg(n) {
  if (!n) return;
  const key = String(n.id), r = msgData.get(key); if (!r) return;
  r.content = n.content; r.edited_at = n.edited_at || r.edited_at;
  const d = document.getElementById('m' + key), mt = d && d.querySelector('.mt');
  if (mt && !mt.querySelector('textarea')) paintText(mt, r);     // não atrapalha quem está editando
}

function subscribe() {
  unsub();
  const id = cur.id, f = 'server_id=eq.' + id;
  rt = sb().channel('srv:' + id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: f }, p => { if (chan && p.new.channel_id === chan.id) { addMsg(p.new); noteMention(p.new, true); } else noteMention(p.new, false); })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, p => { const n = document.getElementById('m' + p.old.id); if (n) { n.remove(); regroup(); } })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'channels', filter: f }, async () => { await loadChans(); renderChans(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'server_members', filter: f }, () => loadMembers())
    .subscribe();
  // canal à parte: se a migração v7 ainda não foi rodada, só estes recursos ficam sem tempo real e o chat segue normal
  rt2 = sb().channel('srvx:' + id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: f }, p => updateMsg(p.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'message_reactions', filter: f }, p => reactAdd(p.new))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'message_reactions' }, p => reactDel(p.old))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'server_roles', filter: f }, () => loadRoles())
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'server_roles' }, () => loadRoles())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'member_roles', filter: f }, () => loadRoles())
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'member_roles' }, () => loadRoles())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'server_emojis', filter: f }, () => loadEmojis())
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'server_emojis' }, () => loadEmojis())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'channel_categories', filter: f }, async () => { await loadChans(); renderChans(); })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'channel_categories' }, async () => { await loadChans(); renderChans(); })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'servers', filter: 'id=eq.' + id }, async () => { await loadServers(); if (cur) $('svName').textContent = cur.name + ' ▾'; })
    .subscribe();
}

      const ps = NS.clean(pend);

          const ins = await sb().rpc('ns_create_channel', { p_server: cur.id, p_name: name, p_kind: c.kind, p_category: catSel && catSel.value ? catSel.value : null });
          if (ins.error || !ins.data) return err(missingFn(ins.error) ? needV15() : '[v15b · passo 1/3 · criar canal] ' + ((ins.error && ins.error.message) || 'erro'));
          c = { ...c, id: ins.data, category_id: catSel && catSel.value ? catSel.value : null }; isNew = false;   // se der erro adiante, salvar de novo só edita
        }
        if (accessChanged()) {
          const ra = await sb().rpc('ns_set_channel_access', { p_channel: c.id, p_private: privChk.checked, p_view_roles: [...viewSet], p_locked: lockChk.checked, p_write_roles: [...writeSet] });

        }
        const { error } = await sb().rpc('ns_update_channel', {
          p_channel: c.id, p_name: name, p_icon: icon || null,
          p_font: ps.font || null, p_color: ps.color || null, p_color2: ps.color2 || null, p_fx: ps.fx || null,

        });
        if (error) {

          if (name !== c.name) { const r = await sb().from('channels').update({ name }).eq('id', c.id); if (r.error) return err(r.error); }   // v13 ainda não rodou: salva só o nome
          err(L('Falta rodar a migração SQL v13 no Supabase para usar ícone, estilo e limite.', 'The v13 SQL migration still needs to be run in Supabase to use icon, style and limit.'));
        }
        const dsc = cleanStr(descIn.value, 150), dps = NS.clean(dpend);
        if (dsc !== (c.description || '') || JSON.stringify(dps) !== JSON.stringify(dsOf(c))) {
          const rd = await sb().rpc('ns_set_channel_description', { p_channel: c.id, p_text: dsc, p_font: dps.font || null, p_color: dps.color || null, p_color2: dps.color2 || null, p_fx: dps.fx || null });
          if (rd.error) err(missingFn(rd.error) ? needV16() : '[v16 · descrição] ' + rd.error.message);
        }
        if (c.kind === 'text') {
          const sl = getSlow();
          if (sl !== (+c.slowmode_seconds || 0)) {
            const rs = await sb().rpc('ns_set_channel_slowmode', { p_channel: c.id, p_seconds: sl });
            if (rs.error) err(missingFn(rs.error) ? needV17() : '[v17 · temporizador] ' + rs.error.message);
          }

        if (catSel && catSel.value !== (c.category_id || '')) {
          const rc = await sb().rpc('ns_set_channel_category', { p_channel: c.id, p_category: catSel.value || null });
          if (rc.error) err(missingFn(rc.error) ? needV15() : rc.error);
        }
        close(); await loadChans(); renderChans();
      } finally { saveBtn.disabled = false; }
    });
    acts.append(mk(t('cancel'), () => close(), 'sec'), saveBtn);
    w.append(acts);
  }, true);
}

/* ----- configurações do servidor ----- */

        saveStyle = async () => {

          if (error) { err(/everyone_policy|column|schema cache/i.test(String(error.message || '')) ? LL('Falta rodar a migração SQL v23 no Supabase para usar isso.', 'The v23 SQL migration still needs to be run in Supabase to use this.') : error); return false; }
          if (!data || !data.length) { err(LL('Não foi possível salvar (falta rodar a migração SQL v23 ou você não é o dono).', 'Could not save (the v23 SQL migration is missing or you are not the owner).')); return false; }
          everyonePolicy = data[0].everyone_policy; s.everyone_policy = everyonePolicy; return true;
        };
      }
      const saveBtn = mk(t('saveChanges'), async () => {
        const name = cleanStr(n.value, 32); if (name.length < 2) return err(t('nameShort'));
        const desc = dt.value.replace(/\r/g, '').replace(CTRL, '').trim().slice(0, 300);
        saveBtn.disabled = true;
        try {
          if (name !== s.name) {
            let { error } = await sb().rpc('ns_set_server_name', { p_server: s.id, p_name: name });
            if (error && missingFn(error)) error = (await sb().from('servers').update({ name }).eq('id', s.id)).error;   // v8 ainda não rodou
            if (error) return err(error);
            s.name = name;
          }
          if (desc !== String(s.description || '')) {
            const { error } = await sb().rpc('ns_set_server_description', { p_server: s.id, p_text: desc });

        await loadServers(); if (cur) $('svName').textContent = cur.name + ' ▾';
        saveBtn.textContent = t('saved'); setTimeout(() => { saveBtn.textContent = t('saveChanges'); }, 1800);
      });
      saveBtn.style.width = '100%';

      s.invite_code = data; close(); dlgSettings();

    mem.forEach(m => {

/* ----- cargos: dar/tirar de uma pessoa ----- */
function rolePicker(m, host) {
  host.textContent = '';
  if (!roles.length) { host.append(el('p', 'mut', t('noRolesHere'))); return; }
  roles.forEach(r => {
    const l = el('label', 'chk'), c = el('input'); c.type = 'checkbox'; c.checked = hasRole(m.user_id, r.id);
    const dot = el('span', 'rdot'); dot.style.setProperty('--c', r.color);
    l.append(c, dot, el('span', '', r.name));
    c.onchange = async () => {
      c.disabled = true;
      const set = new Set(mroles.get(m.user_id) || []); if (c.checked) set.add(r.id); else set.delete(r.id);
      const { error } = await sb().rpc('ns_set_member_roles', { p_server: cur.id, p_user: m.user_id, p_roles: [...set] });
      c.disabled = false;
      if (error) { c.checked = !c.checked; return err(error); }
      mroles.set(m.user_id, set); renderMembers(); repaintNames();
    };
    host.append(l);
  });
}

      if (!name) return err(t('roleNameReq'));
      e.target.disabled = true;
      const args = { p_name: name, p_color: roleColor(), p_hoist: hoist.checked, p_perms: getPerms() };
      const { data: rid, error } = editing ? await sb().rpc('ns_update_role', { p_role: editing.id, ...args }) : await sb().rpc('ns_create_role', { p_server: s.id, ...args });
      e.target.disabled = false; if (error) return err(missingFn(error) ? t('needV8') : error);
      const savedId = await saveRoleStyle(rid, name);
      await saveRoleAuto(savedId);
      resetForm(); await loadRoles(); draw();
    });
    const cancelBtn = mk(t('cancel'), () => resetForm(), 'sec');
    acts.append(okBtn, cancelBtn); form.append(acts);
    const resetForm = () => {
      editing = null; setMode(false); nameIn.placeholder = ''; nameIn.value = ''; loadStyle({ color: '#6c7cff' }); hoist.checked = true; autoChk.checked = false; setPerms([]);
      head.textContent = t('newRoleH'); okBtn.textContent = t('createRole'); cancelBtn.classList.add('hidden'); refreshPrev();
    };
    const setOwnerHidden = async h => {
      const { error } = await sb().rpc('ns_set_owner_role', { p_server: s.id, p_name: null, p_color: null, p_hidden: h });
      if (error) return err(missingFn(error) ? t('needV9') : error);
      await loadServers(); draw();
    };
    /* arrastar e soltar: leva o cargo até a posição escolhida (usa o mesmo "mover" das setas, passo a passo) */
    let dragFrom = -1;
    const moveTo = async (from, to) => {
      const rid = roles[from] && roles[from].id; if (!rid) return;
      const dir = to > from ? 1 : -1;
      for (let k = 0; k < Math.abs(to - from); k++) {
        const { error } = await sb().rpc('ns_move_role', { p_role: rid, p_dir: dir });
        if (error) { err(error); break; }
      }
      await loadRoles(); draw();
    };
    const ownerRow = () => {
      const row = el('div', 'lrow'), dot = el('span', 'rdot'); dot.style.setProperty('--c', ownerColor());
      const g = el('div', 'grow'), nmE = el('b', '', ownerName()); NS.style(nmE, ownerNs(), ownerColor());
      g.append(nmE, el('div', 'mut', t('ownerRoleAuto') + (ownerHidden() ? ' · ' + t('ownerRoleOff') : '')));
      row.append(dot, g);
      if (myRole === 'owner') {
        const ed = mk('✎', () => {
          editing = { owner: true }; setMode(true); nameIn.value = cleanStr(cur && cur.owner_role_name, 24); nameIn.placeholder = t('owner'); loadStyle(ownerNs());
          head.textContent = t('editOwnerH'); okBtn.textContent = t('saveRole'); cancelBtn.classList.remove('hidden'); refreshPrev(); nameIn.focus();
        }, 'sec'); ed.title = t('edit');
        const tg = ownerHidden() ? mk('👁', () => setOwnerHidden(false), 'sec') : mk('✕', () => { if (confirm(t('confirmOwnerHide'))) setOwnerHidden(true); }, 'bad');
        tg.title = ownerHidden() ? t('ownerRoleShow') : t('ownerRoleHide');
        row.append(ed, tg);
      }
      if (ownerHidden()) row.style.opacity = '.6';
      return row;
    };
    const draw = () => {
      list.textContent = '';
      list.append(ownerRow());
      if (!roles.length) list.append(el('p', 'mut', t('noRoles')));
      roles.forEach((r, i) => {
        const row = el('div', 'lrow'), dot = el('span', 'rdot'); dot.style.setProperty('--c', r.color);
        const g = el('div', 'grow'), nmE = el('b', '', r.name); NS.style(nmE, nsOfRole(r), r.color);
        const cnt = mem.filter(m => hasRole(m.user_id, r.id)).length;
        g.append(nmE, el('div', 'mut', t('roleMembers', { n: cnt }) + (r.hoist ? ' · ' + t('hoisted') : '') + (r.auto ? (String(lang).startsWith('en') ? ' · automatic on join' : ' · automático ao entrar') : '') + (r.perms.includes('administrator') ? ' · ' + t('permAll') : r.perms.length ? ' · ' + t('permCount', { n: r.perms.length }) : '')));
        const move = dir => async () => { const { error } = await sb().rpc('ns_move_role', { p_role: r.id, p_dir: dir }); if (error) return err(error); await loadRoles(); draw(); };
        const up = mk('▲', move(-1), 'sec'), dn = mk('▼', move(1), 'sec');
        up.title = t('up'); dn.title = t('down'); up.disabled = i === 0; dn.disabled = i === roles.length - 1;
        const ed = mk('✎', () => {
          editing = r; nameIn.value = r.name; loadStyle({ font: r.name_font, color: r.color, color2: r.name_color2, fx: r.name_fx }); hoist.checked = r.hoist; autoChk.checked = !!r.auto; setPerms(r.perms);
          head.textContent = t('editRoleH'); okBtn.textContent = t('saveRole'); cancelBtn.classList.remove('hidden'); refreshPrev(); nameIn.focus();
        }, 'sec'); ed.title = t('edit');
        const rm = mk('✕', async () => {
          if (!confirm(t('confirmRole', { n: r.name }))) return;
          const { error } = await sb().rpc('ns_delete_role', { p_role: r.id }); if (error) return err(error);
          if (editing && editing.id === r.id) resetForm();
          await loadRoles(); draw();
        }, 'bad'); rm.title = t('del');
        const grip = el('span', 'mut', '⠿'); grip.style.cssText = 'cursor:grab;font-size:1.2rem;line-height:1;user-select:none';
        grip.title = String(lang).startsWith('en') ? 'Drag to reorder' : 'Arraste para reordenar';
        row.append(grip, dot, g, up, dn, ed, rm); list.append(row);
        row.draggable = true;
        row.ondragstart = e => { dragFrom = i; row.style.opacity = '.45'; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)); } catch (x) {} };
        row.ondragend = () => { dragFrom = -1; draw(); };
        row.ondragover = e => { if (dragFrom < 0) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; row.style.boxShadow = dragFrom < i ? '0 3px 0 var(--acc)' : '0 -3px 0 var(--acc)'; };
        row.ondragleave = () => { row.style.boxShadow = ''; };
        row.ondrop = e => { e.preventDefault(); const from = dragFrom; dragFrom = -1; row.style.boxShadow = ''; if (from >= 0 && from !== i) moveTo(from, i); else draw(); };
      });
    };
    w.append(list, head, ownerHint, form);
    resetForm(); draw();
  }, true);
}

/* ----- emojis personalizados do servidor ----- */
function dlgEmojis() {
  const s = cur;
  modal(t('emojisTitle'), (w, close) => {
    w.append(el('p', 'mut', t('emojiHint')));
    const grid = el('div'); grid.style.cssText = 'display:grid;gap:8px';
    const draw = () => {
      grid.textContent = '';
      if (!emojis.length) grid.append(el('p', 'mut', t('emojiEmpty')));
      emojis.forEach(e => {
        const row = el('div', 'lrow'), g = el('div', 'grow');
        g.append(el('b', '', ':' + e.name + ':'));
        row.append(emojiImg(e), g, mk(t('del'), async () => {
          if (!confirm(t('emojiDel', { n: e.name }))) return;
          const { data, error } = await sb().rpc('ns_delete_emoji', { p_id: e.id }); if (error) return err(error);
          if (typeof data === 'string' && data) sb().storage.from('server-emojis').remove([data]);
          await loadEmojis(); draw();
        }, 'bad'));
        grid.append(row);
      });
    };
    const box = el('div', 'box');
    const nameIn = fld(box, t('emojiName'), { maxLength: 24, placeholder: 'ex.: gato_feliz' });
    const file = el('input'); file.type = 'file'; file.hidden = true; file.accept = 'image/png,image/jpeg,image/webp,image/gif';
    const info = el('span', 'mut', ''); let chosen = null;
    file.onchange = async () => {
      const f = file.files[0]; file.value = ''; if (!f) return;
      if (f.size > 262144) return err(t('emojiTooBig'));
      const ty = await A().sniff(f); if (!ty) return err(t('badImg'));
      chosen = { f, ty }; info.textContent = f.name;
      if (!nameIn.value) nameIn.value = f.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 24);
    };
    const pr = el('div', 'pe-actions'); pr.style.alignItems = 'center';
    pr.append(mk(t('emojiPick'), () => file.click(), 'sec'), info);
    const add = mk(t('emojiAdd'), async e => {
      const name = nameIn.value.trim().toLowerCase();
      if (!/^[a-z0-9_]{2,24}$/.test(name)) return err(t('emojiBadName'));
      if (!chosen) return err(t('emojiNoFile'));
      e.target.disabled = true;
      const path = s.id + '/' + Date.now() + '-' + rndHex(4) + '.' + chosen.ty.ext;
      const up = await sb().storage.from('server-emojis').upload(path, chosen.f, { contentType: chosen.ty.mime, cacheControl: '31536000', upsert: false });
      if (up.error) { e.target.disabled = false; return err(up.error); }
      const { error } = await sb().rpc('ns_add_emoji', { p_server: s.id, p_name: name, p_path: path });
      e.target.disabled = false;
      if (error) { sb().storage.from('server-emojis').remove([path]); return err(error); }
      chosen = null; info.textContent = ''; nameIn.value = '';
      await loadEmojis(); draw();
    });
    box.append(pr, add, file);
    w.append(grid, box); draw();
  }, true);
}

/* ----- painel do dono do site (só aparece para a conta dona; tudo é conferido no servidor) ----- */
function dlgAdmin() {
  modal('Painel do dono do site', w => {
    const names = [['tags', 'Tags'], ['people', 'Pessoas'], ['owners', 'Donos'], ['servers', 'Servidores'], ['stats', 'Resumo']];
    const tabs = el('div', 'tabs t5'), body = el('div'); body.style.cssText = 'display:grid;gap:14px';
    let prefill = '';
    const show = k => { [...tabs.children].forEach((b, i) => b.classList.toggle('on', names[i][0] === k)); body.textContent = ''; panes[k](); };
    names.forEach(([k, lab]) => tabs.append(mk(lab, () => show(k), '')));
    w.append(tabs, body);

    const row = (...kids) => { const r = el('div', 'lrow'); r.append(...kids); return r; };
    const grow = (...kids) => { const g = el('div', 'grow'); g.append(...kids); return g; };
    const listOf = () => { const l = el('div'); l.style.cssText = 'display:grid;gap:8px'; return l; };

    const panes = {
      /* ---- tags ---- */
      tags() {
        let editing = null;
        const form = el('div', 'box');
        const pf = prefill; prefill = '';
        const uIn = fld(form, '@ da pessoa', { maxLength: 21, placeholder: '@usuario' });
        uIn.autocapitalize = 'none'; uIn.spellcheck = false;
        const lIn = fld(form, 'Nome da tag', { maxLength: 20, placeholder: 'Ex.: Dono do site' });
        const prev = el('span', 'gbadge', 'Prévia');
        const refresh = () => { prev.textContent = cleanStr(lIn.value, 20) || 'Prévia'; prev.style.setProperty('--c', cp.get() || '#6c7cff'); };
        lIn.oninput = refresh;
        const presets = el('div', 'chips');
        [['Dono do site', '#f1c40f'], ['Beta', '#3498db'], ['Staff', '#e74c3c'], ['Apoiador', '#e91e63'], ['VIP', '#9b59b6'], ['Verificado', '#49d9ff']]
          .forEach(([lab, c]) => presets.append(mk(lab, () => { lIn.value = lab; cp.set(c); refresh(); }, 'sec')));
        const cl = el('div'); cl.style.cssText = 'display:grid;gap:8px'; cl.append(el('span', 'mut', 'Atalhos e cor da tag (e do nome na tag)'), presets);
        const cp = colorPicker('#6c7cff', refresh); cl.append(cp.node); form.append(cl);
        const dl = el('label'), dur = el('select'), dtIn = el('input'); dtIn.type = 'datetime-local'; dtIn.classList.add('hidden');
        const setDur = (editingNow) => {
          dur.textContent = '';
          const opts = (editingNow ? [['keep', 'Manter como está']] : []).concat([['perm', 'Permanente'], ['1h', '1 hora'], ['1d', '1 dia'], ['7d', '7 dias'], ['30d', '30 dias'], ['custom', 'Data e hora específicas...']]);
          opts.forEach(([v, x]) => { const o = el('option', '', x); o.value = v; dur.append(o); });
          dur.value = editingNow ? 'keep' : 'perm'; dtIn.classList.add('hidden');
        };
        dur.onchange = () => dtIn.classList.toggle('hidden', dur.value !== 'custom');
        dl.append(el('span', '', 'Duração'), dur, dtIn); form.append(dl);
        const pr = el('div'); pr.style.cssText = 'display:flex;gap:8px;align-items:center'; pr.append(el('span', 'mut', 'Prévia'), prev); form.append(pr);
        const expiry = () => {
          const v = dur.value;
          if (v === 'keep') return editing.expires_at || null;
          if (v === 'perm') return null;
          if (v === 'custom') { const d = new Date(dtIn.value); if (!dtIn.value || isNaN(d)) throw new Error('Escolha a data e a hora em que a tag expira.'); return d.toISOString(); }
          return new Date(Date.now() + ({ '1h': 3600e3, '1d': 864e5, '7d': 7 * 864e5, '30d': 30 * 864e5 })[v]).toISOString();
        };
        const acts = el('div', 'pe-actions');
        const okBtn = mk('Dar tag', async e => {
          const label = cleanStr(lIn.value, 20), user = uIn.value.trim().replace(/^@/, '').toLowerCase();
          if (!editing && !ULOW.test(user)) return err('Digite o @ da pessoa (3 a 20 letras minúsculas, números ou _).');
          if (!label) return err('Digite o nome da tag.');
          let exp; try { exp = expiry(); } catch (x) { return err(x); }
          e.target.disabled = true;
          const { error } = editing
            ? await sb().rpc('ns_admin_update_badge', { p_id: editing.id, p_label: label, p_color: cp.get(), p_expires_at: exp })
            : await sb().rpc('ns_admin_give_badge', { p_username: user, p_label: label, p_color: cp.get(), p_expires_at: exp });
          e.target.disabled = false; if (error) return err(error);
          reset(); bcache.clear(); wantBadges(mem.map(m => m.username)); load();
        });
        const cancelBtn = mk('Cancelar edição', () => reset(), 'sec');
        acts.append(okBtn, cancelBtn); form.append(acts);
        const reset = () => {
          editing = null; uIn.value = ''; uIn.readOnly = false; lIn.value = ''; cp.set('#6c7cff'); setDur(false);
          okBtn.textContent = 'Dar tag'; cancelBtn.classList.add('hidden'); refresh();
        };
        const filter = fld(body, 'Tags existentes — filtrar por @ ou nome', { maxLength: 30 });
        const box = listOf(); let rows = [];
        const draw = () => {
          box.textContent = ''; const q = filter.value.trim().toLowerCase().replace(/^@/, '');
          const sel = rows.filter(r => !q || (r.username || '').includes(q) || r.label.toLowerCase().includes(q));
          if (!sel.length) box.append(el('p', 'mut', rows.length ? 'Nada encontrado.' : 'Nenhuma tag criada ainda.'));
          sel.forEach(r => {
            const p = el('span', 'gbadge', r.label); p.style.setProperty('--c', okHex(r.color) || '#6c7cff');
            const st = r.expires_at ? (r.active ? 'expira em ' + fmtDate(r.expires_at) : 'expirou em ' + fmtDate(r.expires_at)) : 'permanente';
            const info = grow(el('b', '', '@' + (r.username || '?')), el('div', 'mut', (r.display_name || '') + ' · ' + st));
            const ed = mk('Editar', () => {
              editing = r; uIn.value = '@' + r.username; uIn.readOnly = true; lIn.value = r.label; cp.set(okHex(r.color) || '#6c7cff'); setDur(true);
              okBtn.textContent = 'Salvar tag'; cancelBtn.classList.remove('hidden'); refresh(); form.scrollIntoView({ block: 'nearest' });
            }, 'sec');
            const rm = mk('Remover', async () => {
              if (!confirm('Remover a tag "' + r.label + '" de @' + r.username + '?')) return;
              const { error } = await sb().rpc('ns_admin_remove_badge', { p_id: r.id }); if (error) return err(error);
              bcache.clear(); wantBadges(mem.map(m => m.username)); load();
            }, 'bad');
            const rw = row(p, info, ed, rm); if (!r.active) rw.style.opacity = '.6'; box.append(rw);
          });
        };
        const load = async () => {
          const { data, error } = await sb().rpc('ns_admin_list_badges');
          if (error) { box.textContent = ''; box.append(el('p', 'amsg err', 'Não foi possível carregar: ' + error.message + ' (rodou a migração SQL?)')); return; }
          rows = data || []; draw();
        };
        filter.oninput = draw;
        body.prepend(form); body.append(box);
        reset(); load();
        if (pf) { uIn.value = '@' + pf; lIn.focus(); }
      },
      /* ---- pessoas ---- */
      people() {
        const q = fld(body, 'Buscar por @ ou nome', { maxLength: 30 }); const box = listOf(); body.append(box);
        let tm = 0;
        const run = async () => {
          const { data, error } = await sb().rpc('ns_admin_find_user', { p_q: q.value });
          box.textContent = '';
          if (error) return box.append(el('p', 'amsg err', error.message));
          if (!(data || []).length) return box.append(el('p', 'mut', 'Ninguém encontrado.'));
          data.forEach(u => {
            const go = mk('Dar tag', () => { prefill = u.username || ''; show('tags'); }, 'sec'); go.disabled = !u.username;
            box.append(row(A().avatar(u, 32), grow(el('b', '', u.display_name), el('div', 'mut', (u.username ? '@' + u.username : 'sem @') + ' · ' + u.tags + ' tag(s) · ' + u.servers + ' servidor(es)')), go));
          });
        };
        q.oninput = () => { clearTimeout(tm); tm = setTimeout(run, 300); };
        run();
      },
      /* ---- donos do site ---- */
      owners() {
        const form = el('div', 'box');
        const uIn = fld(form, '@ da nova pessoa dona', { maxLength: 21, placeholder: '@usuario' });
        uIn.autocapitalize = 'none'; uIn.spellcheck = false;
        form.append(el('p', 'mut', 'Donos do site têm acesso total a este painel e podem adicionar outros donos. Só o dono principal (o primeiro) pode remover donos, e ninguém remove a si mesmo.'));
        const addBtn = mk('Adicionar como dono', async e => {
          const user = uIn.value.trim().replace(/^@/, '').toLowerCase();
          if (!ULOW.test(user)) return err('Digite o @ da pessoa (3 a 20 letras minúsculas, números ou _).');
          if (!confirm('Tornar @' + user + ' dono do site? Ela terá acesso total a este painel.')) return;
          e.target.disabled = true;
          const { error } = await sb().rpc('ns_admin_add_owner', { p_username: user });
          e.target.disabled = false;
          if (error) return err(missingFn(error) ? 'Falta rodar a migração SQL v18 no Supabase (donos do site).' : error);
          uIn.value = ''; load();
        });
        form.append(addBtn);
        const box = listOf();
        const load = async () => {
          const { data, error } = await sb().rpc('ns_admin_list_owners');
          box.textContent = '';
          if (error) return box.append(el('p', 'amsg err', missingFn(error) ? 'Falta rodar a migração SQL v18 no Supabase (donos do site).' : 'Não foi possível carregar: ' + error.message));
          const hasPrim = (data || []).some(o => o.is_primary !== undefined);   // v19 já rodou?
          const iAmPrimary = hasPrim ? (data || []).some(o => o.is_me && o.is_primary) : true;
          (data || []).forEach(o => {
            const who = o.username ? '@' + o.username : 'conta sem @';
            const nm = el('b', '', o.display_name || who);
            if (o.is_me) { const me = el('span', 'gbadge', 'você'); me.style.setProperty('--c', '#f1c40f'); nm.append(' ', me); }
            if (o.is_primary) { const pr = el('span', 'gbadge', 'dono principal'); pr.style.setProperty('--c', '#ff9f43'); nm.append(' ', pr); }
            const info = grow(nm, el('div', 'mut', who + ' · dono desde ' + fmtDate(o.created_at)));
            const rm = mk('Remover', async () => {
              if (o.is_me) return err('Você não pode se remover de dono do site.');
              if (!iAmPrimary) return err('Só o dono principal pode remover donos.');
              if (!confirm('Remover ' + who + ' dos donos do site?')) return;
              const { error: e2 } = await sb().rpc('ns_admin_remove_owner', { p_user: o.user_id });
              if (e2) return err(e2);
              load();
            }, 'bad');
            if (o.is_me) { rm.disabled = true; rm.title = 'Você não pode se remover de dono do site'; }
            else if (!iAmPrimary) { rm.disabled = true; rm.title = 'Só o dono principal pode remover donos'; }
            box.append(row(A().avatar({ display_name: o.display_name || who, avatar_path: o.avatar_path }, 32), info, rm));
          });

        };

        load();
      },
      /* ---- servidores ---- */
      servers() {
        const q = fld(body, 'Buscar servidor por nome', { maxLength: 32 }); const box = listOf(); body.append(box);
        let tm = 0;
        const run = async () => {
          const [{ data, error }, off] = await Promise.all([
            sb().rpc('ns_admin_list_servers', { p_q: q.value }),
            sb().rpc('ns_official_server')
          ]);
          const offMissing = !!off.error;                       // v21 ainda não rodou
          const offId = offMissing || off.data == null ? '' : String(off.data);
          box.textContent = '';
          if (error) return box.append(el('p', 'amsg err', error.message));
          if (offMissing && missingFn(off.error)) box.append(el('p', 'mut', 'Falta rodar a migração SQL v21 no Supabase para usar o servidor oficial.'));
          if (!(data || []).length) return box.append(el('p', 'mut', 'Nenhum servidor.'));
          data.forEach(s => {
            const isOff = !!offId && String(s.id) === offId;
            const star = offMissing ? null : mk(isOff ? 'Remover oficial' : 'Tornar oficial', async () => {
              const msg = isOff
                ? 'Remover o status de oficial de \"' + s.name + '\"? Novas contas deixarão de entrar nele automaticamente.'
                : 'Tornar \"' + s.name + '\" o servidor oficial? Toda conta nova entrará nele automaticamente (substitui o oficial atual, se houver).';
              if (!confirm(msg)) return;
              const { error: e2 } = await sb().rpc('ns_admin_set_official', { p_id: isOff ? null : String(s.id) });
              if (e2) return err(e2);
              run();
            }, 'sec');
            const nm = el('b', '', s.name);
            if (isOff) { const tag = el('span', '', ' ★ Oficial'); tag.style.color = 'var(--warning)'; nm.append(tag); }
            const rm = mk('Apagar', async () => {
              if (!confirm('Apagar o servidor "' + s.name + '" com todos os canais e mensagens? Isso não pode ser desfeito.')) return;
              const { error: e2 } = await sb().rpc('ns_admin_delete_server', { p_id: s.id }); if (e2) return err(e2);
              if (cur && cur.id === s.id) closeView();
              loadServers(); run();
            }, 'bad');
            box.append(row(grow(nm, el('div', 'mut', 'dono: ' + (s.owner_username ? '@' + s.owner_username : '?') + ' · ' + s.members + ' membro(s) · criado em ' + fmtDate(s.created_at))), ...[star, rm].filter(Boolean)));
          });
        };
        q.oninput = () => { clearTimeout(tm); tm = setTimeout(run, 300); };
        run();
      },
      /* ---- resumo ---- */
      stats() {
        const box = el('div', 'stats'); body.append(box);
        sb().rpc('ns_admin_stats').then(({ data, error }) => {
          if (error) return box.replaceWith(el('p', 'amsg err', error.message));
          [['users', 'Contas'], ['servers', 'Servidores'], ['messages', 'Mensagens'], ['tags', 'Tags ativas'], ['emojis', 'Emojis']].forEach(([k, lab]) => {
            const c = el('div', 'stat'); c.append(el('b', '', String((data || {})[k] ?? 0)), el('span', 'mut', lab)); box.append(c);
          });
        });
      }
    };
    show('tags');
  }, true);
}

renderRail();
/* ----- extras do cartão de perfil: tags, cargos e moderação ----- */
function cardExtras(p, box) {
  if (p && p.username) {
    const g = badgeEl(p.username), bio = box.querySelector('.pc-bio');
    g.style.marginTop = '6px';
    if (bio) box.insertBefore(g, bio); else box.append(g);
  }
  const m = cur && mem.find(x => (p.user_id && x.user_id === p.user_id) || (p.username && x.username === p.username));
  if (!m) return;
  { const ps = el('span', 'pstat'); ps.dataset.u = m.user_id; const k = stOf(m.user_id) || 'off'; ps.dataset.st = k; ps.textContent = presInfo(k)[0]; const bio0 = box.querySelector('.pc-bio'); if (bio0) box.insertBefore(ps, bio0); else box.append(ps); }
  const lab = k => k === 'owner' ? t('owner') : k === 'admin' ? t('admin') : t('member');
  /* uma única seção "Cargos": cargo base (Dono/Admin/Membro) + cargos personalizados */
  const rs = roles.filter(r => hasRole(m.user_id, r.id));
  const sep = el('div', 'sgrp'); sep.append(el('span', '', t('roles')));
  box.append(sep);
  const chips = el('div', 'rchips');
  const base = el('span', 'gbadge', m.role === 'owner' ? ownerName() : lab(m.role));
  base.style.setProperty('--c', m.role === 'owner' ? ownerColor() : m.role === 'admin' ? '#6c7cff' : '#9da8c2');
  if (m.role === 'owner') NS.style(base, ownerNs(), '');
  if (!(m.role === 'owner' && ownerHidden())) chips.append(base);
  rs.forEach(r => { const c = el('span', 'gbadge', r.name); c.style.setProperty('--c', r.color); NS.style(c, nsOfRole(r), ''); chips.append(c); });
  box.append(chips);
  if (myRole === 'owner' && m.role !== 'owner') {
    const sel = el('select'); sel.style.marginTop = '8px';
    [['member', t('member')], ['admin', t('admin')]].forEach(([v, x]) => { const o = el('option', '', x); o.value = v; sel.append(o); });
    sel.value = m.role;
    sel.onchange = async () => {
      const { error } = await sb().rpc('set_member_role', { p_server: cur.id, p_user: m.user_id, p_role: sel.value });
      if (error) { err(error); sel.value = m.role; return; }
      m.role = sel.value; loadMembers();
      base.textContent = lab(m.role); base.style.setProperty('--c', m.role === 'admin' ? '#6c7cff' : '#9da8c2');
    };
    box.append(sel);
  }
  if (can('manage_roles') && roles.length) {
    const host = el('div', 'rpick'); box.append(host); rolePicker(m, host);
  }
  if (isAdm() && m.user_id !== uid && m.role !== 'owner' && (myRole === 'owner' || m.role === 'member')) {
    const b = mk(t('kick'), async () => {
      if (!confirm(t('confirmKick', { n: m.display_name }))) return;
      const { error } = await sb().rpc('kick_member', { p_server: cur.id, p_user: m.user_id });
      if (error) return err(error);
      $('dlgCard').close(); loadMembers();
    }, 'sec');
    b.style.marginTop = '10px'; box.append(b);
  }
}
return { onAuth, cardExtras, badgeEl, colorOfUser, colorSig, statusButton };
})();
</script>
